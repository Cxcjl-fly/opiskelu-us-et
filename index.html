/* V2 visual improvements */
:root{--bg:#f5f7f2;--surface:#fff;--text:#17211b;--muted:#607064;--accent:#315b43;--line:#dbe3dc;--shadow:0 12px 35px rgba(20,40,28,.10)}
body{background:var(--bg);color:var(--text);transition:background .3s,color .3s}
.card,.panel,.chapter-card,.comments,.task,.hero,.modal,.side-menu{background:var(--surface);color:var(--text);border-color:var(--line)}
.theme-toggle{position:fixed;top:18px;right:72px;z-index:1000;border:1px solid var(--line);background:var(--surface);color:var(--text);width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
.visual-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}
.visual-gallery .visual-card{min-height:150px;border-radius:20px;overflow:hidden;position:relative;background:linear-gradient(145deg,#dce9df,#eef3ed);border:1px solid var(--line)}
.visual-gallery svg{width:100%;height:100%;display:block}
.visual-card span{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.82);padding:5px 9px;border-radius:999px;font-size:12px}
.chapter-illustration{width:100%;max-height:330px;object-fit:cover;border-radius:24px;margin:14px 0 26px;border:1px solid var(--line);box-shadow:var(--shadow)}
@media(max-width:800px){.visual-gallery{grid-template-columns:repeat(2,1fr)}.theme-toggle{right:64px}}
@media(max-width:480px){.visual-gallery{grid-template-columns:1fr 1fr}.visual-gallery .visual-card{min-height:120px}}
body.dark{--bg:#101613;--surface:#18201b;--text:#edf3ed;--muted:#aebcb1;--accent:#8fc5a1;--line:#304038;--shadow:0 14px 35px rgba(0,0,0,.28)}
body.dark .theme-toggle{background:var(--surface);color:var(--text)}
body.dark .visual-card{background:linear-gradient(145deg,#20372a,#16231c)}
body.dark .visual-card span{background:rgba(20,28,23,.82);color:#edf3ed}


/* ===== V3: visual gallery, theme switcher and forum ===== */
.theme-switcher{
  position:fixed;right:18px;top:18px;z-index:1200;
  display:flex;gap:4px;padding:4px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);box-shadow:var(--shadow);
}
.theme-switcher button{
  border:0;background:transparent;color:var(--text);width:38px;height:34px;
  border-radius:999px;cursor:pointer;font-size:16px;
}
.theme-switcher button.active{background:var(--accent);color:#fff}
.mega-gallery{max-width:1180px;margin:30px auto 55px;padding:0 18px}
.gallery-title{text-align:center;margin-bottom:20px}
.gallery-title span,.section-kicker{letter-spacing:.16em;font-size:12px;color:var(--accent);font-weight:700}
.gallery-title h2{margin:7px 0 0}
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gpic{
  position:relative;min-height:180px;border-radius:22px;overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--shadow);
  background-size:cover;background-position:center;
}
.gpic:before,.gpic:after{content:"";position:absolute;inset:0}
.gpic:after{background:linear-gradient(transparent 45%,rgba(0,0,0,.58))}
.gpic span{position:absolute;z-index:2;left:14px;bottom:13px;color:#fff;font-weight:700;text-shadow:0 1px 4px #000}
.lake{background:linear-gradient(160deg,#b9d7e1 0 38%,#59745d 39% 59%,#719ca6 60% 100%)}
.lake:before{background:linear-gradient(135deg,transparent 42%,rgba(255,255,255,.6) 43% 45%,transparent 46%);transform:scale(2)}
.pine{background:linear-gradient(#c6dbe1 0 35%,#3f624d 36% 100%)}
.pine:before{background:repeating-linear-gradient(110deg,transparent 0 25px,#274633 26px 48px);opacity:.8}
.aurora{background:linear-gradient(160deg,#071923,#193d42 48%,#253b2c)}
.aurora:before{background:radial-gradient(ellipse at 55% 20%,rgba(180,240,190,.8),transparent 38%),radial-gradient(ellipse at 30% 30%,rgba(130,200,220,.45),transparent 35%)}
.cabin{background:linear-gradient(#cbdde0 0 46%,#526b50 47% 100%)}
.cabin:before{inset:auto 15% 20% 15%;height:50%;background:#765844;clip-path:polygon(50% 0,100% 35%,100% 100%,0 100%,0 35%);box-shadow:inset 0 20px #8e6b51}
.winter{background:linear-gradient(#b8cbd7 0 50%,#f4f5f2 51% 100%)}
.winter:before{background:repeating-linear-gradient(110deg,transparent 0 28px,#58705e 29px 40px);opacity:.65}
.meadow{background:linear-gradient(#e1cda9 0 45%,#738c60 46% 100%)}
.meadow:before{background:radial-gradient(circle at 20% 30%,#fff 0 3px,transparent 4px),radial-gradient(circle at 60% 25%,#fff 0 3px,transparent 4px),radial-gradient(circle at 75% 55%,#fff 0 3px,transparent 4px)}
.study{background:linear-gradient(135deg,#d7c6ae,#f2eadc)}
.study:before{inset:20% 13%;background:repeating-linear-gradient(#8c755e 0 3px,transparent 4px 17px);border-radius:7px;box-shadow:0 0 0 12px #eee7dc}
.mountain{background:linear-gradient(#b9d0d9 0 48%,#5d725c 49% 100%)}
.mountain:before{background:linear-gradient(135deg,transparent 35%,#6c7f70 36% 55%,transparent 56%),linear-gradient(35deg,transparent 38%,#415a48 39% 70%,transparent 71%)}
.forestpath{background:linear-gradient(120deg,#314d3b,#728866)}
.forestpath:before{background:linear-gradient(65deg,transparent 40%,#c3ad89 41% 58%,transparent 59%);filter:blur(1px)}
.autumn{background:linear-gradient(#d5b28e 0 42%,#7a6548 43% 100%)}
.autumn:before{background:radial-gradient(circle at 20% 35%,#b56d48 0 16px,transparent 17px),radial-gradient(circle at 70% 28%,#c68a49 0 18px,transparent 19px),radial-gradient(circle at 45% 55%,#9c5b43 0 14px,transparent 15px)}
.island{background:linear-gradient(#bdd6df 0 48%,#769ba3 49% 100%)}
.island:before{inset:34% 20% 30%;background:#526c50;border-radius:50% 55% 45% 45%}
.sunrise{background:linear-gradient(#d5c3b2 0 45%,#7c8f6b 46% 100%)}
.sunrise:before{background:radial-gradient(circle at 50% 45%,#f1c681 0 35px,transparent 36px)}
.forum-section{max-width:1000px;margin:40px auto;padding:30px 18px}
.forum-intro{color:var(--muted)}
.forum-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.forum-tab{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.forum-tab.active{background:var(--accent);color:#fff}
.forum-form{display:grid;gap:10px;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.forum-form input,.forum-form select,.forum-form textarea{
  width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit
}
.forum-form textarea{min-height:110px;resize:vertical}
.forum-form button{justify-self:start;border:0;border-radius:12px;padding:11px 17px;background:var(--accent);color:#fff;cursor:pointer}
.forum-note{font-size:13px;color:var(--muted)}
.forum-list{display:grid;gap:12px;margin-top:18px}
.forum-post{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.forum-post-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.forum-badge{font-size:11px;letter-spacing:.08em;padding:5px 8px;border-radius:999px;background:var(--bg);color:var(--accent)}
.forum-post h3{margin:9px 0 5px}
.forum-post p{color:var(--muted);white-space:pre-wrap}
.forum-meta{font-size:12px;color:var(--muted)}
@media(max-width:900px){.gallery-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.gallery-grid{grid-template-columns:repeat(2,1fr)}.gpic{min-height:140px}}
@media(max-width:420px){.gallery-grid{grid-template-columns:1fr}.gpic{min-height:170px}}


/* V4: strong readable text over image backgrounds */
body{
  --text-on-image:#fff;
  --image-overlay:linear-gradient(135deg,rgba(8,22,14,.72),rgba(18,45,29,.42));
}
.hero,.hero-section,.home-hero{
  position:relative;
  overflow:hidden;
  color:#fff !important;
  background-image:var(--image-overlay),linear-gradient(135deg,#365c46,#789b84) !important;
  min-height:360px;
  display:flex;
  align-items:center;
}
.hero::before,.hero-section::before,.home-hero::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 78% 25%,rgba(255,255,255,.28),transparent 22%),
    linear-gradient(125deg,transparent 45%,rgba(255,255,255,.08) 46% 48%,transparent 49%);
  pointer-events:none;
}
.hero>* ,.hero-section>* ,.home-hero>*{position:relative;z-index:1}
.hero h1,.hero h2,.hero h3,.hero p,
.hero-section h1,.hero-section h2,.hero-section h3,.hero-section p,
.home-hero h1,.home-hero h2,.home-hero h3,.home-hero p{
  color:#fff !important;
  text-shadow:0 2px 12px rgba(0,0,0,.65);
}
.hero p,.hero-section p,.home-hero p{max-width:760px}
.hero .button,.hero-section .button,.home-hero .button,
.hero button,.hero-section button,.home-hero button{
  box-shadow:0 5px 18px rgba(0,0,0,.22);
}
.card,.panel,.chapter-card,.comments,.task,.forum-post{
  color:var(--text);
}
.card p,.panel p,.chapter-card p,.comments p,.task p,.forum-post p{
  color:var(--muted);
}
/* Put important headings on image-like banners for contrast */
.chapter-header,.page-banner,.section-banner{
  position:relative;
  color:#fff !important;
  border-radius:24px;
  padding:38px 30px;
  overflow:hidden;
  background:
    linear-gradient(135deg,rgba(13,36,24,.80),rgba(43,79,57,.50)),
    linear-gradient(120deg,#466b52,#9bb29d) !important;
  box-shadow:var(--shadow);
}
.chapter-header::after,.page-banner::after,.section-banner::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 75% 20%,rgba(255,255,255,.24),transparent 25%);
  pointer-events:none;
}
.chapter-header>* ,.page-banner>* ,.section-banner>*{position:relative;z-index:1}
.chapter-header h1,.chapter-header h2,.chapter-header p,
.page-banner h1,.page-banner h2,.page-banner p,
.section-banner h1,.section-banner h2,.section-banner p{
  color:#fff !important;text-shadow:0 2px 10px rgba(0,0,0,.65);
}
/* Light theme: never allow muted text to become too pale */
body:not(.dark){--text:#17211b;--muted:#405247}
body:not(.dark) .forum-note,body:not(.dark) .forum-meta{color:#53665a}
body:not(.dark) .card,body:not(.dark) .panel,body:not(.dark) .chapter-card,
body:not(.dark) .comments,body:not(.dark) .task,body:not(.dark) .forum-post{
  background:#fff;
}
/* Make section labels readable on pale backgrounds */
body:not(.dark) .section-kicker{color:#28553c}
/* Optional image-style title cards */
.image-title-card{
  color:#fff!important;border-radius:24px;padding:28px;min-height:180px;
  display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(0deg,rgba(0,0,0,.72),rgba(0,0,0,.08)),linear-gradient(135deg,#53745e,#b0c7b5);
  box-shadow:var(--shadow);overflow:hidden;
}
.image-title-card *{color:#fff!important;text-shadow:0 2px 8px rgba(0,0,0,.7)}


/* V5: synchronized text colors for light/dark themes */
:root{
  --bg:#f5f7f2;
  --surface:#ffffff;
  --surface-2:#eef3ee;
  --text:#16211a;
  --text-strong:#0d1711;
  --muted:#405247;
  --accent:#315b43;
  --line:#d4ded7;
}
body.dark{
  --bg:#101613;
  --surface:#18201b;
  --surface-2:#202b24;
  --text:#edf5ee;
  --text-strong:#ffffff;
  --muted:#c0cdc3;
  --accent:#9bcbaa;
  --line:#35443a;
}
body,body *{
  transition:color .2s ease,background-color .2s ease,border-color .2s ease;
}
body{
  background:var(--bg)!important;
  color:var(--text)!important;
}
body h1,body h2,body h3,body h4,body h5,body h6,
body p,body li,body label,body span,body div{
  color:inherit;
}
body a{color:var(--accent)}
body .card,body .panel,body .chapter-card,body .comments,
body .task,body .forum-post,body .forum-form{
  background:var(--surface)!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
}
body .card p,body .panel p,body .chapter-card p,
body .comments p,body .task p,body .forum-post p,
body .forum-note,body .forum-meta{
  color:var(--muted)!important;
}
body input,body textarea,body select{
  background:var(--surface-2)!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
}
body input::placeholder,body textarea::placeholder{color:var(--muted)!important;opacity:.9}
body .theme-switcher{
  background:var(--surface)!important;
  border-color:var(--line)!important;
}
body .theme-switcher button{color:var(--text)!important}
body .theme-switcher button.active{background:var(--accent)!important;color:#fff!important}
/* Menus and navigation also follow the selected theme */
body .side-menu,body .menu,body nav,body header{
  color:var(--text);
}
body .side-menu a,body nav a{color:var(--text)}
/* Image banners deliberately keep white text in BOTH themes */
body .hero,body .hero-section,body .home-hero,
body .chapter-header,body .page-banner,body .section-banner,
body .image-title-card{
  color:#fff!important;
}
body .hero *,body .hero-section *,body .home-hero *,
body .chapter-header *,body .page-banner *,body .section-banner *,
body .image-title-card *{
  color:#fff!important;
}
/* Buttons with light backgrounds must stay readable */
body button:not(.theme-switcher button){
  color:var(--text);
}
body .forum-tab{background:var(--surface)!important;color:var(--text)!important;border-color:var(--line)!important}
body .forum-tab.active{background:var(--accent)!important;color:#fff!important}


/* V6: profile button directly under the hamburger menu */
.profile-btn,.profile-button,#profile-btn,#profile-button{
  position:fixed!important;
  left:18px!important;
  top:70px!important;
  right:auto!important;
  z-index:1190!important;
}
@media(max-width:600px){
  .profile-btn,.profile-button,#profile-btn,#profile-button{
    left:14px!important;
    top:66px!important;
  }
}


/* V7: theme applies everywhere, including PÄÄVALIKKO and forum entries */
body, body.dark{
  --bg: #f5f7f2;
  --surface: #ffffff;
  --surface-2: #eef3ee;
  --text: #16211a;
  --text-strong: #0d1711;
  --muted: #405247;
  --accent: #315b43;
  --line: #d4ded7;
}
body.dark{
  --bg: #101613;
  --surface: #18201b;
  --surface-2: #202b24;
  --text: #edf5ee;
  --text-strong: #ffffff;
  --muted: #c0cdc3;
  --accent: #9bcbaa;
  --line: #35443a;
}

/* Force every main UI container to use theme variables */
body, main, header, footer, nav, section, article, aside,
.paa-menu, .paavalikko, .main-menu, .side-menu, .sidebar,
.menu-panel, .modal, .profile-panel, .comments, .comment,
.forum-section, .forum-list, .forum-post, .forum-form,
.card, .panel, .chapter-card, .task, .content, .catalog,
.chapter, .page, .selection, .choice, .option{
  color:var(--text);
}

/* PÄÄVALIKKO */
.paa-menu, .paavalikko, .main-menu, .side-menu, .sidebar, .menu-panel{
  background:var(--surface)!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
}
.paa-menu *, .paavalikko *, .main-menu *, .side-menu *, .sidebar *, .menu-panel *{
  color:var(--text)!important;
}
.paa-menu a, .paavalikko a, .main-menu a, .side-menu a, .sidebar a, .menu-panel a{
  color:var(--text)!important;
}
.paa-menu a:hover, .paavalikko a:hover, .main-menu a:hover,
.side-menu a:hover, .sidebar a:hover, .menu-panel a:hover{
  color:var(--accent)!important;
  background:var(--surface-2)!important;
}

/* All cards/records */
.card,.panel,.chapter-card,.task,.comments,.comment,.forum-post,.forum-form,
.selection,.choice,.option{
  background:var(--surface)!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
}
.card *, .panel *, .chapter-card *, .task *, .comments *, .comment *,
.forum-post *, .forum-form *, .selection *, .choice *, .option *{
  color:var(--text);
}
.card p,.panel p,.chapter-card p,.task p,.comments p,.comment p,

</aside><div id="adminPanel" class="v26-admin-panel hidden" aria-hidden="true"></div><main id="app"></main><footer>© 2026 Opiskelu-sivusto. Kaikki oikeudet pidätetään. Sivuston sisältö on tarkoitettu opiskeluun ja kokeisiin valmistautumiseen.</footer><script>const DATA={"US":[["US 1","Eettisen pohdinnan perusteet","Etiikka tarkoittaa pohdintaa siitä, mikä on oikein, väärin, hyvää, pahaa, oikeudenmukaista tai epäoikeudenmukaista. Moraali tarkoittaa ihmisen tai yhteisön käsityksiä siitä, miten pitäisi toimia. Arvot ovat asioita, joita pidämme tärkeinä, kuten rehellisyys, turvallisuus, vapaus, tasa-arvo ja toisten kunnioittaminen. Normit ovat sääntöjä tai odotuksia, jotka ohjaavat toimintaa. Kaikki säännöt eivät kuitenkaan ole moraalisia sääntöjä: esimerkiksi koulun käytännön sääntö voi helpottaa arkea, kun taas moraalinen sääntö liittyy usein siihen, miten toimintamme vaikuttaa toisiin ihmisiin.\n\nEettisessä pohdinnassa ei riitä, että sanoo ”minusta tämä on väärin”. Tärkeää on osata perustella kanta. Hyvä perustelu voi liittyä esimerkiksi seurauksiin, oikeuksiin, velvollisuuksiin, ihmisarvoon tai hyveisiin. Sama tilanne voidaan arvioida eri teorioiden avulla. Seurausetiikka kysyy, mitä teosta seuraa. Velvollisuusetiikka painottaa sitä, mitä pitäisi tehdä velvollisuuden tai periaatteen vuoksi. Hyve-etiikka kysyy, millainen ihminen toimii tilanteessa hyvin ja millaisia luonteenpiirteitä pitäisi kehittää.\n\nEettinen ongelma syntyy usein silloin, kun kaksi tärkeää arvoa joutuu ristiriitaan. Esimerkiksi totuuden kertominen voi olla ristiriidassa halun kanssa suojella toista ihmistä. Silloin vaihtoehtoja pitää verrata rauhallisesti. Mieti, keihin päätös vaikuttaa, mitä seurauksia sillä voi olla, mitä oikeuksia tilanteessa on ja millä perusteella oma johtopäätös voidaan puolustaa. Kokeessa hyvä vastaus määrittelee käsitteen, käyttää konkreettista esimerkkiä ja perustelee johtopäätöksen.\n\nMuistilause kontrolliin: etiikka = pohdinta oikeasta ja väärästä, moraali = käsitykset hyvästä ja pahasta, arvo = tärkeänä pidetty asia, normi = toimintaa ohjaava sääntö. Muista myös kolme näkökulmaa: seuraus, velvollisuus ja hyve. Kun saat esimerkkitilanteen, nimeä ongelma, tunnista arvot, vertaile vaihtoehtoja ja perustele johtopäätös."],["US 2","Suuret elämänkysymykset","Suuret elämänkysymykset koskevat asioita, joihin ei yleensä ole yhtä ainoaa vastausta. Tällaisia kysymyksiä ovat esimerkiksi: Mikä on elämän tarkoitus? Mikä tekee elämästä hyvän? Miksi ihmiset kärsivät? Mitä kuoleman jälkeen tapahtuu? Miten pitäisi suhtautua rakkauteen, ystävyyteen ja yksinäisyyteen? Näitä kysymyksiä voidaan tarkastella uskonnollisesta, filosofisesta ja ei-uskonnollisesta näkökulmasta.\n\nElämän tarkoitus voi eri ihmisille tarkoittaa eri asioita. Jollekin tärkeintä voi olla perhe ja ystävät, toiselle usko, työ, oppiminen, luovuus, luonnosta huolehtiminen tai muiden auttaminen. Merkityksellinen elämä ei tarkoita sitä, että ihminen olisi aina onnellinen. Myös vaikeuksien, pettymysten ja menetyksen keskellä ihminen voi kokea, että hänen elämällään on arvoa. Kärsimystä voidaan pitää ongelmana, jota pitäisi vähentää, mutta eri maailmankatsomukset selittävät kärsimystä eri tavoin.\n\nKuolemaa koskevissa kysymyksissä uskonnolliset perinteet voivat opettaa esimerkiksi kuolemanjälkeisestä elämästä, ylösnousemuksesta, jälleensyntymästä tai sielun kohtalosta. Ei-uskonnollinen näkökulma voi korostaa sitä, että kuolema on biologisen elämän päättyminen ja että elämän merkitystä voidaan rakentaa tässä elämässä. Rakkauteen liittyvät puolestaan luottamus, kunnioitus, vastuu, suostumus ja toisen ihmisarvon huomioiminen.\n\nKontrollissa kannattaa muistaa, että suurissa elämänkysymyksissä tärkeää ei ole arvata opettajan mielipidettä. Tärkeää on osoittaa, että tunnet erilaisia näkökulmia, osaat verrata niitä ja pystyt perustelemaan oman ajatuksesi.\n\nMuistilause kontrolliin: suuret elämänkysymykset eivät ole pelkkiä faktoja. Osaa verrata ainakin uskonnollista ja ei-uskonnollista näkökulmaa. Muista käsitteet elämän tarkoitus, merkityksellisyys, kärsimys, kuolema, rakkaus ja maailmankatsomus. Hyvä vastaus antaa useamman mahdollisen näkemyksen ja perustelee, miksi eri ihmiset voivat päätyä erilaisiin vastauksiin."],["US 3","Raamatun eettisiä periaatteita","Raamatun eettisiä periaatteita voidaan tarkastella sekä Vanhan että Uuden testamentin tekstien kautta. Raamattu ei ole yksi ainoa lakikirja, vaan eri aikoina syntyneiden tekstien kokoelma. Siksi eettisiä ohjeita pitää ymmärtää niiden yhteydessä. Vanhassa testamentissa tärkeitä ovat esimerkiksi kymmenen käskyä, oikeudenmukaisuus, lähimmäisen huomioiminen ja ajatus siitä, että Jumalan ja ihmisen suhteeseen kuuluu vastuu. Uudessa testamentissa Jeesuksen opetukset, lähimmäisenrakkaus, anteeksianto ja kultainen sääntö ovat keskeisiä.\n\nKymmenessä käskyssä korostuvat esimerkiksi elämän kunnioittaminen, rehellisyys, uskollisuus ja toisen omaisuuden kunnioittaminen. Jeesuksen opetuksissa moraalia ei kuitenkaan kuvata vain ulkoisina sääntöinä. Vuorisaarnassa korostuu myös ihmisen sisäinen asenne. Lähimmäisenrakkaus tarkoittaa, että toisen hyvää ei pidetä merkityksettömänä. Samarialaisen vertaus puolestaan opettaa, että lähimmäinen ei tarkoita vain omaan ryhmään kuuluvaa henkilöä.\n\nRaamatun eettisiä tekstejä tulkittaessa pitää huomioida, että kristityt voivat painottaa eri asioita. Osa korostaa sääntöjen noudattamista, osa armoa ja anteeksiantoa, osa lähimmäisenrakkautta ja oikeudenmukaisuutta. Kokeessa kannattaa erottaa toisistaan se, mitä Raamatun tekstissä sanotaan, ja oma mielipide siitä, miten opetusta pitäisi soveltaa nykyajan tilanteeseen.\n\nHyvä vastaus voi käyttää rakennetta: käsite tai raamatun opetus → selitys → esimerkki nykyelämästä → oma perusteltu johtopäätös. Näin osoitat, että ymmärrät periaatteen etkä vain muista yksittäistä lausetta.\n\nMuistilause kontrolliin: osaa erottaa Vanhan ja Uuden testamentin, tunnista kymmenen käskyä, lähimmäisenrakkaus, anteeksianto ja kultainen sääntö. Älä vain luettele raamatunkohtia. Selitä aina, mikä eettinen periaate niissä näkyy ja miten sitä voisi soveltaa nykyiseen tilanteeseen. Muista myös, että kristityt voivat tulkita samaa opetusta eri tavoin."],["US 4","Lähi-idän uskontojen eettinen ajattelu","Lähi-idän uskontojen eettiseen ajatteluun liittyvät erityisesti juutalaisuus, kristinusko ja islam. Niillä on yhteisiä historiallisia juuria ja monia yhteisiä moraalisia teemoja, mutta niiden opetukset ja tulkinnat eivät ole samanlaisia. Juutalaisuudessa Toora, käskyt, oikeudenmukaisuus ja yhteisön vastuu ovat tärkeitä. Kristilliseen etiikkaan liittyvät esimerkiksi lähimmäisenrakkaus, anteeksianto, armo ja Jeesuksen opetukset. Islamissa Koraani ja profeetta Muhammadin esimerkki ovat keskeisiä, ja moraaliseen toimintaan liittyvät esimerkiksi oikeudenmukaisuus, armollisuus, vastuu ja yhteisön huomioiminen.\n\nJuutalaisessa ajattelussa mitzvot tarkoittavat käskyjä tai velvollisuuksia, joiden avulla ihminen harjoittaa uskontoa ja toimii oikein. Islamissa viiden peruspilarin tunteminen auttaa ymmärtämään, miten uskonto liittyy käytännön elämään: uskontunnustus, rukous, almuvero, paasto ja pyhiinvaellus ovat keskeisiä. Kristinuskon eri suuntauksissa eettisiä kysymyksiä voidaan perustella esimerkiksi Raamatulla, Jeesuksen opetuksilla, kirkon perinteellä ja omallatunnolla.\n\nNäissä uskonnoissa moraali ei tarkoita vain yksityisiä valintoja. Se liittyy myös köyhyyteen, auttamiseen, oikeudenmukaisuuteen, perheeseen, yhteisöön ja muiden ihmisten kohteluun. Uskonnollinen etiikka voi perustua ajatukseen Jumalan tahdosta, pyhistä teksteistä ja yhteisön tulkintaperinteestä. Samalla yksilöt voivat tulkita samaa perinnettä eri tavalla.\n\nKontrollissa vertaile mieluummin kuin luettele. Kerro esimerkiksi yksi yhteinen piirre ja yksi ero. Hyvä vertailu selittää, miksi kaksi perinnettä voi päätyä samanlaiseen moraaliseen tavoitteeseen eri perustelujen kautta.\n\nMuistilause kontrolliin: juutalaisuus, kristinusko ja islam ovat historiallisesti sukulaisia, mutta eivät sama uskonto. Osaa yhdistää Tooran ja mitzvot juutalaisuuteen, Jeesuksen opetukset kristinuskoon sekä Koraanin ja profeetan esimerkin islamiin. Vertaile yhteisiä arvoja, kuten oikeudenmukaisuutta ja auttamista, ja selitä myös vähintään yksi ero."],["US 5","Kaukoidän uskonnot ja etiikka","Kaukoidän uskontojen ja maailmankatsomusten etiikkaan liittyvät esimerkiksi hindulaisuus, buddhalaisuus, jainalaisuus, taolaisuus ja kungfutselaisuus. Näitä ei pidä ajatella yhtenä samanlaisena ryhmänä. Niillä on erilaiset käsitykset ihmisestä, todellisuudesta ja hyvästä elämästä. Yhteisiä teemoja ovat kuitenkin esimerkiksi kärsimyksen vähentäminen, itsekurin harjoittaminen, muiden huomioiminen ja oman toiminnan seurausten ymmärtäminen.\n\nHindulaisuudessa dharma tarkoittaa velvollisuutta, oikeaa elämäntapaa ja järjestystä, joka liittyy myös ihmisen asemaan ja elämäntilanteeseen. Karma tarkoittaa teon ja sen seurausten välistä yhteyttä. Buddhalaisuudessa keskeistä on kärsimyksen ymmärtäminen ja siitä vapautumiseen tähtäävä harjoitus. Kahdeksanosainen polku sisältää esimerkiksi oikean toiminnan, oikean puheen ja oikean elämänkeinon. Ahimsa eli väkivallattomuus on tärkeä käsite erityisesti jainalaisuudessa ja myös muissa intialaisissa perinteissä.\n\nKungfutselaisuus painottaa ihmissuhteita, kasvatusta, kunnioitusta ja yhteiskunnallista vastuuta. Taolaisuudessa korostuu tasapaino ja luonnollinen toiminta, jota voidaan kuvata käsitteellä wu wei. Eettinen ihanne ei siis aina tarkoita mahdollisimman suurta määrää sääntöjä, vaan joskus kykyä toimia harkitusti ja välttää tarpeetonta vahinkoa.\n\nKokeessa kannattaa osata yhdistää käsite oikeaan perinteeseen ja selittää se omin sanoin. Muista erityisesti karma, dharma, ahimsa, buddhalainen kahdeksanosainen polku, kungfutselainen ihmissuhde-etiikka ja taolainen tasapaino. Pelkkä käsitteen nimeäminen ei riitä, vaan kerro, mitä se tarkoittaa eettisen toiminnan kannalta.\n\nMuistilause kontrolliin: karma liittyy tekojen seurauksiin, dharma oikeaan elämäntapaan ja velvollisuuteen, ahimsa väkivallattomuuteen. Buddhalaisuudessa keskeisiä ovat kärsimyksen ymmärtäminen ja kahdeksanosainen polku. Kungfutselaisuus painottaa ihmissuhteita ja kunnioitusta, taolaisuus tasapainoa ja luonnollista toimintaa. Osaa selittää käsitteet omin sanoin."],["US 6","Ihmisoikeudet ja etiikka","Ihmisoikeudet perustuvat ajatukseen, että jokaisella ihmisellä on ihmisarvo ja tiettyjä oikeuksia riippumatta esimerkiksi syntyperästä, sukupuolesta, uskonnosta, kielestä tai asemasta. Ihmisoikeuksiin liittyvät esimerkiksi oikeus elämään, henkilökohtaiseen turvallisuuteen, koulutukseen, mielipiteen- ja uskonnonvapauteen sekä syrjimättömyyteen. Ihmisoikeudet muodostavat tärkeän perustan modernille eettiselle ja yhteiskunnalliselle ajattelulle.\n\nIhmisarvo tarkoittaa, että ihmistä ei pitäisi kohdella pelkkänä välineenä muiden tavoitteille. Tämä näkyy esimerkiksi siinä, että kidutusta, mielivaltaista syrjintää ja ihmisten hyväksikäyttöä pidetään vakavina vääryyksinä. Oikeudet eivät kuitenkaan tarkoita, että jokainen ihminen voisi tehdä mitä tahansa. Yhden henkilön vapaus voi joutua tasapainoon toisen henkilön oikeuksien ja turvallisuuden kanssa.\n\nIhmisoikeusetiikassa on tärkeää ymmärtää myös vastuu. Jos ihmisellä on oikeus koulutukseen, yhteiskunnan pitää pyrkiä luomaan olosuhteet, joissa koulutus on mahdollista. Jos ihmisellä on sananvapaus, hänen pitää samalla ymmärtää, että muiden ihmisarvo ja oikeudet ovat olemassa. Käytännön tilanteissa voidaan joutua punnitsemaan esimerkiksi yksityisyyttä, turvallisuutta, tasa-arvoa ja vapautta.\n\nKontrollissa kannattaa osata erottaa ihmisoikeus, laki ja moraalinen mielipide. Kaikki moraalisesti hyvä toiminta ei ole laissa pakollista, eikä kaikki lain sallima toiminta ole välttämättä moraalisesti ongelmatonta. Hyvä vastaus määrittelee oikeuden, kertoo miksi se on tärkeä ja antaa esimerkin tilanteesta, jossa oikeudet voivat olla ristiriidassa keskenään.\n\nMuistilause kontrolliin: ihmisoikeudet kuuluvat ihmiselle ihmisarvon perusteella. Osaa nimetä oikeuksia, selittää syrjimättömyyden ja erottaa ihmisoikeuden, lain ja henkilökohtaisen mielipiteen. Kun oikeudet joutuvat ristiriitaan, punnitse molempia. Esimerkiksi sananvapaus ja yksityisyys voivat vaatia tasapainoa. Perustele aina, miksi tietty ratkaisu kunnioittaa ihmisarvoa."],["US 7","Ihminen ja etiikka","Ihmisen ja etiikan kysymyksissä tarkastellaan sitä, millainen ihminen on moraalisena toimijana. Ihmisellä on kyky tehdä valintoja, arvioida vaihtoehtoja ja perustella tekojaan, mutta hänen toimintaansa vaikuttavat myös tunteet, kasvatus, ympäristö, kulttuuri, ystävät, media, biologiset tarpeet ja elämäntilanne. Siksi ihmistä ei ole helppo kuvata täysin vapaaksi eikä täysin muiden ohjaamaksi.\n\nMoraalinen vastuu liittyy siihen, kuinka paljon henkilö pystyy ymmärtämään tilanteen ja vaikuttamaan omaan toimintaansa. Esimerkiksi vahingossa tapahtunutta tekoa arvioidaan eri tavalla kuin tarkoituksellista tekoa. Myös ikä, painostus, tietämättömyys ja erityiset olosuhteet voivat vaikuttaa vastuuseen. Tarkoitus on tärkeä, mutta se ei aina poista seurauksia. Ihminen voi tarkoittaa hyvää ja silti aiheuttaa vahinkoa.\n\nHyve-etiikka tarkastelee ihmisen luonnetta. Hyveitä voivat olla esimerkiksi rohkeus, oikeudenmukaisuus, rehellisyys, kohtuullisuus ja myötätunto. Ajatus on, että hyvä toiminta ei ole vain yksittäisten sääntöjen noudattamista, vaan myös hyvän luonteen harjoittamista. Harjoittelu, tottumukset ja muiden ihmisten esimerkki vaikuttavat siihen, millaisia toimintatapoja ihminen kehittää.\n\nKokeessa kannattaa käyttää erottelua: teko, tarkoitus, seuraukset ja vastuu. Jos kysytään, onko henkilö moraalisesti vastuussa, kerro ensin mitä tapahtui, sitten mitä henkilö tiesi ja halusi, mitä vaihtoehtoja hänellä oli ja miten hänen toimintansa vaikutti muihin. Tämä tekee vastauksesta täsmällisen eikä pelkästään mielipiteen.\n\nMuistilause kontrolliin: moraalinen vastuu liittyy tietoon, tarkoitukseen, valinnanmahdollisuuksiin ja seurauksiin. Erota vahinko ja tarkoituksellinen teko. Hyve-etiikassa kysytään, millainen ihminen pitäisi olla, ei vain mitä yksi sääntö määrää. Osaa käyttää esimerkkeinä rohkeutta, oikeudenmukaisuutta, rehellisyyttä ja kohtuullisuutta. Selitä myös, miten kasvatus ja ympäristö vaikuttavat moraaliseen toimintaan."],["US 8","Elämänkaarien etiikka","Elämänkaarien etiikka tarkastelee moraalisia kysymyksiä eri elämänvaiheissa. Lapsuuteen liittyvät esimerkiksi oikeus turvallisuuteen, kasvatukseen, leikkiin ja koulutukseen. Nuoruudessa korostuvat itsenäistyminen, identiteetti, kaverisuhteet, seksuaalisuus, päihteet ja päätösten seuraukset. Aikuisuudessa voidaan pohtia työtä, perhettä, vanhemmuutta, taloutta ja vastuuta. Vanhuudessa kysymyksiä voivat olla toimintakyky, hoiva, yksinäisyys, itsemääräämisoikeus ja elämän loppuvaihe.\n\nEettinen näkökulma ei tarkoita, että yksi ikäryhmä olisi toista arvokkaampi. Ihmisarvo kuuluu kaikille. Sen sijaan eri elämäntilanteissa ihmisen tarpeet ja riippuvuus toisista voivat muuttua. Lapsi tarvitsee erityistä suojelua, koska hänen mahdollisuutensa päättää omista asioistaan ovat rajallisemmat. Iäkkään ihmisen hoidossa taas pitää kunnioittaa sekä turvallisuutta että itsemääräämisoikeutta.\n\nHoivaetiikka korostaa suhteita, huolenpitoa ja riippuvuutta. Se muistuttaa, että moraali ei aina ole vain yksilön valintojen arvioimista. Myös se, miten yhteiskunta järjestää koulutuksen, terveydenhuollon, vanhuspalvelut ja tuen perheille, on eettinen kysymys.\n\nKontrollissa kannattaa välttää liian yksinkertaista vastausta. Jos kysytään esimerkiksi vanhusten hoidosta, kerro sekä yksilön oikeudet että hoivan tarve. Jos käsitellään nuoren vapautta, huomioi sekä itsenäisyys että turvallisuus. Hyvä vastaus osoittaa, että osaat yhdistää ihmisarvon, vastuun, oikeudet ja käytännön tilanteen.\n\nMuistilause kontrolliin: ihmisarvo kuuluu kaikille elämänvaiheesta riippumatta. Lapsen kohdalla korostuu suojelu ja oikeus kehittyä, nuorella itsenäistyminen ja vastuu, aikuisella monet yhteiskunnalliset ja perheeseen liittyvät velvollisuudet, vanhuksella hoiva ja itsemääräämisoikeus. Osaa yhdistää yksilön oikeudet ja yhteiskunnan vastuun. Hoivaetiikka muistuttaa ihmissuhteiden merkityksestä."],["US 9","Yhteiskunta ja etiikka","Yhteiskunta ja etiikka liittyvät toisiinsa, koska yhteiset päätökset vaikuttavat monien ihmisten elämään. Eettisiä kysymyksiä syntyy esimerkiksi rikollisuudesta ja rangaistuksista, taloudellisesta eriarvoisuudesta, teknologiasta, mediasta, politiikasta ja siitä, miten yhteisiä resursseja jaetaan. Yhteiskunnan tehtävä ei ole vain ylläpitää järjestystä, vaan myös suojella ihmisiä ja mahdollistaa oikeudenmukainen osallistuminen.\n\nRangaistuksen tarkoituksesta voidaan esittää erilaisia näkemyksiä. Rangaistus voi pyrkiä estämään rikoksia, suojelemaan yhteiskuntaa, muuttamaan rikoksentekijän toimintaa tai ilmaisemaan, että teko on väärin. Oikeudenmukaisuus vaatii myös suhteellisuutta: rangaistuksen pitäisi sopia teon vakavuuteen. Samalla pitää pohtia, miten uhreja ja rikoksentekijöitä kohdellaan ihmisarvoa kunnioittaen.\n\nTeknologia tuo uusia eettisiä ongelmia. Algoritmit voivat vaikuttaa siihen, mitä tietoa näemme, millaisia palveluja saamme ja miten meitä arvioidaan. Tekoälyn käytössä voidaan joutua pohtimaan yksityisyyttä, oikeudenmukaisuutta, vastuuta ja virheiden seurauksia. Mediaan liittyy puolestaan kysymys siitä, miten tieto leviää ja miten disinformaatio voi vaikuttaa ihmisten päätöksiin.\n\nKontrollissa hyvä yhteiskuntaetiikan vastaus yhdistää yksilön ja yhteisön näkökulmat. Kysy: kuka hyötyy, kuka voi kärsiä, mitä oikeuksia tilanteessa on, mitä seurauksia päätöksellä voi olla ja onko ratkaisu reilu myös niiden kannalta, joilla on vähän valtaa. Lopuksi perustele oma kantasi selkeästi.\n\nMuistilause kontrolliin: yhteiskuntaetiikassa kysy aina, kuka hyötyy, kuka kärsii, miten valta jakautuu ja onko ratkaisu oikeudenmukainen. Rangaistuksissa muista ehkäisy, suojelu, kuntoutus ja suhteellisuus. Teknologiassa huomioi yksityisyys, algoritmien vaikutus ja vastuu. Mediassa lähdekritiikki on tärkeää. Hyvä vastaus yhdistää yksilön vapauden ja yhteisen hyvän."],["US 10","Ympäristöetiikka","Ympäristöetiikka käsittelee ihmisen suhdetta luontoon, eläimiin ja tuleviin sukupolviin. Keskeinen kysymys on, onko luonnolla arvoa vain siksi, että se hyödyttää ihmistä, vai onko luonnolla itseisarvoa. Ihmiskeskeinen näkökulma painottaa ihmisten hyvinvointia ja luonnon merkitystä esimerkiksi ravinnon, veden, terveyden ja talouden kannalta. Luontokeskeisempi näkökulma korostaa ekosysteemien ja muiden eliöiden arvoa myös riippumatta niiden hyödystä ihmisille.\n\nKestävä kehitys tarkoittaa sitä, että nykyiset tarpeet pyritään täyttämään vaarantamatta tulevien sukupolvien mahdollisuuksia hyvään elämään. Siksi ympäristöongelmia ei voida arvioida vain tämän päivän kustannusten perusteella. Ilmastonmuutos, luonnon monimuotoisuuden väheneminen, kulutus, energiantuotanto ja saastuminen vaikuttavat sekä ihmisiin että muihin eliöihin pitkällä aikavälillä.\n\nYmpäristöetiikkaan liittyy myös vastuun jakaminen. Yksilö voi vaikuttaa esimerkiksi kulutukseen, liikkumiseen ja energiankäyttöön, mutta yrityksillä ja valtioilla on paljon suuremmat mahdollisuudet vaikuttaa tuotantoon, lainsäädäntöön ja infrastruktuuriin. Siksi vastuuta ei ole reilua siirtää kokonaan yksittäiselle ihmiselle.\n\nKontrollissa kannattaa erottaa ympäristöä koskeva fakta ja eettinen arvio. Ensin kerro, mitä tapahtuu, sitten miksi sillä on merkitystä ja lopuksi, mitä pitäisi tehdä. Hyvässä vastauksessa voit käyttää käsitteitä kestävä kehitys, luonnon itseisarvo, tulevat sukupolvet, vastuu ja oikeudenmukaisuus.\n\nMuistilause kontrolliin: ympäristöetiikassa osaa erottaa ihmiskeskeisen ja luontokeskeisen näkökulman. Muista kestävä kehitys, tulevat sukupolvet, luonnon itseisarvo ja vastuun jakaminen. Ympäristöongelmassa erottele ensin fakta, sitten eettinen ongelma ja lopuksi ratkaisu. Älä siirrä kaikkea vastuuta yksilölle, vaan arvioi myös yritysten, valtioiden ja yhteiskunnan mahdollisuuksia vaikuttaa."]],"ET":[["ET 1","Itsenäinen ajattelu","Itsenäinen ajattelu tarkoittaa kykyä muodostaa ja arvioida omia käsityksiä perustelujen, tiedon ja harkinnan avulla. Se ei tarkoita, että pitäisi aina olla eri mieltä muiden kanssa. Itsenäinen ajattelija voi hyväksyä toisen näkemyksen, jos perustelut ovat vakuuttavia. Tärkeää on, ettei mielipidettä pidetä automaattisesti totena vain siksi, että sen sanoi ystävä, opettaja, julkisuuden henkilö tai suuri joukko ihmisiä.\n\nFilosofisessa ajattelussa kysytään usein, mitä väite tarkoittaa, mihin se perustuu ja mitä seurauksia sen hyväksymisellä olisi. Hyvä ajattelu erottaa toisistaan faktan, tulkinnan, mielipiteen ja perustelun. Kriittinen ajattelu ei tarkoita kaiken epäilemistä, vaan sitä, että väitteitä arvioidaan suhteessa näyttöön ja perustelujen laatuun.\n\nArgumentissa on yleensä väite ja sitä tukevia perusteluja. Heikko argumentti voi perustua esimerkiksi henkilöön hyökkäämiseen, liian nopeaan yleistykseen tai ajatukseen, että jokin on totta vain siksi, että moni uskoo siihen. Myös omat ennakkokäsitykset voivat vaikuttaa siihen, mitä tietoa hyväksymme. Siksi on hyödyllistä kysyä, mikä saisi minut muuttamaan mielipidettäni.\n\nKontrollissa hyvä vastaus ei ole pitkä vain pituuden vuoksi. Tärkeämpää on rakenne: väite → perustelu → esimerkki → vastanäkemys → johtopäätös. Jos pystyt selittämään, miksi pidät jotakin perustelua vahvana ja huomioit myös toisen näkökulman, osoitat itsenäistä ja kriittistä ajattelua.\n\nMuistilause kontrolliin: itsenäinen ajattelu ei tarkoita vastustamista vaan perusteltua arviointia. Erota fakta, mielipide, väite ja perustelu. Tunnista heikot perustelut, kuten henkilöön hyökkääminen ja hätäinen yleistys. Hyvä vastaus rakentuu väitteestä, perustelusta, esimerkistä ja johtopäätöksestä. Näytä myös, että pystyt arvioimaan omaa kantaasi ja muuttamaan sitä, jos parempi perustelu löytyy."],["ET 2","Elämän tarkoitus, arvot ja hyveet","Elämän tarkoitus, arvot ja hyveet liittyvät kysymykseen siitä, millaista elämää pidetään hyvänä ja merkityksellisenä. Arvo on asia, jota pidämme tärkeänä ja tavoittelemisen arvoisena. Arvoja voivat olla esimerkiksi vapaus, turvallisuus, oikeudenmukaisuus, ystävyys, terveys, tieto ja rehellisyys. Arvot voivat olla ristiriidassa keskenään: esimerkiksi täydellinen turvallisuus voi rajoittaa vapautta.\n\nElämän tarkoitukseen voidaan vastata monella tavalla. Jotkut näkevät tarkoituksen uskonnossa tai suhteessa Jumalaan. Toiset löytävät merkitystä ihmissuhteista, työstä, oppimisesta, luovuudesta, luonnosta tai muiden auttamisesta. Eksistentialistisessa ajattelussa ihminen voi joutua itse rakentamaan merkityksen ilman valmista universaalia tarkoitusta. Tärkeää on erottaa toisistaan ”mikä tekee minut onnelliseksi nyt” ja ”mikä tekee elämästä kokonaisuutena merkityksellisen”.\n\nHyve on hyväksi katsottu luonteenpiirre tai toimintatapa. Esimerkiksi rohkeus tarkoittaa kykyä toimia oikein myös silloin, kun pelottaa. Kohtuullisuus tarkoittaa kykyä välttää äärimmäisyyksiä. Rehellisyys liittyy totuudenmukaiseen toimintaan. Hyveet eivät synny vain lukemalla määritelmiä, vaan niitä kehitetään toistuvalla harjoittelulla ja valinnoilla.\n\nKontrollissa erottele arvo, tavoite ja hyve. Arvo kertoo, mikä on tärkeää, tavoite kertoo mitä halutaan saavuttaa ja hyve kertoo, millaista luonnetta tai toimintatapaa pidetään hyvänä. Hyvä vastaus antaa aina esimerkin ja perustelee, miksi kyseinen asia voi tehdä elämästä parempaa tai merkityksellisempää.\n\nMuistilause kontrolliin: arvo kertoo, mikä on tärkeää, tavoite kertoo mitä halutaan saavuttaa ja hyve kertoo hyvästä luonteesta tai toimintatavasta. Elämän tarkoituksesta voi olla monia perusteltuja näkemyksiä. Muista käsitteet merkityksellisyys, vapaus, onnellisuus ja hyve. Kun vastaat, anna esimerkki ja selitä, miksi kyseinen arvo tai hyve voi tehdä elämästä hyvää."],["ET 3","Valinnat, vapaus ja vastuu","Vapaus ja vastuu kuuluvat yhteen. Vapaudella voidaan tarkoittaa mahdollisuutta valita eri toimintatapoja ilman tarpeetonta pakkoa. Käytännössä ihmisen vapaus ei ole rajaton. Lait, muiden ihmisten oikeudet, oma taloudellinen tilanne, terveys, kasvatustausta, tunteet ja sosiaalinen ympäristö vaikuttavat siihen, mitä vaihtoehtoja todella on.\n\nMoraalisessa päätöksessä on tärkeää erottaa halu, valinta ja vastuu. Ihminen voi haluta jotakin, mutta se ei tarkoita, että hänen pitäisi tehdä niin. Vapaus merkitsee myös kykyä pysähtyä ja arvioida vaihtoehtoja. Vastuu puolestaan liittyy siihen, että ihminen voi joutua vastaamaan teoistaan ja niiden vaikutuksista. Vastuun määrä riippuu esimerkiksi tiedosta, tarkoituksesta, mahdollisuuksista ja siitä, kuinka paljon henkilö pystyi hallitsemaan toimintaansa.\n\nDeterminismi on näkemys, jonka mukaan tapahtumilla on syitä ja ihmisenkin toiminta voi olla monien tekijöiden vaikutusta. Vapaa tahto taas korostaa ihmisen kykyä tehdä valintoja. Näiden välillä on myös yhteensopivuutta etsivä ajatus, jonka mukaan ihminen voi olla vastuullinen, vaikka hänen toiminnallaan olisi syitä ja taustatekijöitä.\n\nKontrollissa älä vastaa vain ”ihminen on vapaa” tai ”ihminen ei ole vapaa”. Selitä, missä mielessä ihminen voi valita ja mitkä tekijät rajoittavat valintaa. Hyvä vastaus käsittelee myös seurauksia: mitä enemmän ihminen pystyy vaikuttamaan tekoonsa ja ymmärtämään sen seurauksia, sitä vahvemmin vastuuta voidaan yleensä perustella.\n\nMuistilause kontrolliin: vapaus ei tarkoita rajattomuutta. Osaa selittää, miten lait, muiden oikeudet, tunteet, kasvatus ja elämäntilanne rajoittavat valintoja. Vastuu vahvistuu, kun ihminen ymmärtää tekonsa ja pystyy vaikuttamaan siihen. Muista vapaa tahto ja determinismi. Hyvässä vastauksessa et valitse vain yhtä ääripäätä, vaan arvioit sekä vapauden että rajoittavien tekijöiden merkitystä."],["ET 4","Seurausten eettinen arviointi","Seurausetiikassa teon moraalista arvoa arvioidaan sen perusteella, mitä teosta seuraa. Utilitarismi on tunnettu seurausetiikan muoto. Sen perusajatus on, että moraalisessa päätöksessä pitäisi pyrkiä mahdollisimman hyvään kokonaisseuraamukseen ja vähentämään kärsimystä. Jeremy Bentham ja John Stuart Mill ovat keskeisiä utilitarismin klassisia ajattelijoita. Mill korosti myös sitä, että hyvinvoinnin laatu voi olla merkityksellistä eikä vain määrää tarvitse verrata.\n\nSeurausetiikan vahvuus on, että se pakottaa miettimään käytännön vaikutuksia. Päätöksessä ei riitä hyvä tarkoitus, jos lopputulos aiheuttaa paljon vahinkoa. Toisaalta kaikkia seurauksia ei voi tietää varmasti. Lisäksi voi olla vaikeaa päättää, kenen hyvinvointi pitäisi laskea mukaan ja miten erilaisia haittoja ja hyötyjä verrataan.\n\nEettinen dilemma syntyy, kun kaksi moraalisesti tärkeää asiaa joutuu ristiriitaan. Esimerkiksi yhden ihmisen auttaminen voi viedä resursseja useilta muilta. Hyvässä analyysissä luetellaan vaihtoehdot, arvioidaan seuraukset eri ihmisille, huomioidaan todennäköisyys ja epävarmuus ja tehdään perusteltu johtopäätös.\n\nKontrollissa käytä rakennetta: 1) mikä teko tai päätös on kyseessä, 2) mitä vaihtoehtoja on, 3) mitä hyötyä ja haittaa niistä seuraa, 4) keihin vaikutus kohdistuu, 5) mikä vaihtoehto tuottaa parhaan kokonaisuuden ja 6) mikä on oma johtopäätös. Jos vertaat seurausetiikkaa velvollisuusetiikkaan, muista: seurausetiikka painottaa lopputulosta, velvollisuusetiikka itse teon periaatetta tai velvollisuutta.\n\nMuistilause kontrolliin: seurausetiikka arvioi tekoa lopputuloksen perusteella. Utilitarismissa pyritään mahdollisimman suureen kokonais-hyvinvointiin. Muista Bentham ja Mill. Kun analysoit dilemmaa, vertaile vaihtoehtojen hyötyjä ja haittoja, vaikutusten kohteita ja epävarmuutta. Vertaa tarvittaessa velvollisuusetiikkaan: siinä oikea teko ei riipu vain seurauksesta vaan myös moraalisesta periaatteesta tai velvollisuudesta."],["ET 5","Sananvapaus ja median etiikka","Sananvapaus tarkoittaa oikeutta ilmaista ajatuksia ja vastaanottaa tietoa. Se on tärkeä osa demokraattista yhteiskuntaa, koska ihmisillä pitää olla mahdollisuus keskustella, kritisoida vallankäyttäjiä ja osallistua yhteisiin asioihin. Sananvapaus ei kuitenkaan tarkoita, että jokainen ilmaisu olisi automaattisesti hyväksyttävä tai että muiden oikeudet voisi sivuuttaa.\n\nMedian etiikassa keskeisiä arvoja ovat totuudenmukaisuus, lähdekritiikki, yksityisyyden suoja, oikeudenmukaisuus ja vastuu. Toimittajan tai sisällöntuottajan pitäisi arvioida, onko tieto riittävän luotettavaa ja onko julkaisemisesta enemmän hyötyä kuin haittaa. Yksityiselämän suoja voi olla tärkeä esimerkiksi silloin, kun kyseessä on alaikäinen tai henkilö, joka ei ole julkisuuden henkilö.\n\nSosiaalinen media tekee jokaisesta mahdollisen tiedon levittäjän. Siksi medialukutaito kuuluu myös tavalliselle käyttäjälle. Tarkista kuka väitteen julkaisi, milloin se julkaistiin, mihin väite perustuu ja löytyykö sama tieto useasta riippumattomasta lähteestä. Varo erityisesti sisältöä, joka yrittää saada aikaan voimakkaan tunne-reaktion ennen kuin lukija ehtii tarkistaa väitteen. Disinformaatio on tarkoituksellisesti harhaanjohtavaa tietoa, kun taas väärä tieto voi levitä myös ilman tarkoituksellista huijaamista.\n\nKontrollissa erottele sananvapaus ja vastuu. Hyvä vastaus kertoo, miksi sananvapaus on tärkeä, mutta myös millaisia seurauksia julkaisemisella voi olla. Käytä käsitteitä lähdekritiikki, yksityisyys, vastuu, disinformaatio ja luotettavuus.\n\nMuistilause kontrolliin: sananvapaus mahdollistaa keskustelun, kritiikin ja osallistumisen, mutta siihen liittyy vastuu. Muista lähdekritiikki, yksityisyys, disinformaatio, luotettavuus ja seuraukset. Tarkista kuka julkaisi tiedon, milloin ja mihin väite perustuu. Hyvä kontrollivastaus osoittaa, että osaat puolustaa sananvapautta samalla kun huomioit muiden oikeudet ja mahdollisen vahingon."],["ET 6","Ihmissuhteiden etiikka","Ihmissuhteiden etiikka käsittelee sitä, miten ihmisiä pitäisi kohdella ystävyydessä, perheessä, seurustelussa ja muissa läheisissä suhteissa. Tärkeitä periaatteita ovat ihmisarvon kunnioittaminen, luottamus, rehellisyys, tasavertaisuus, turvallisuus ja toisen rajojen huomioiminen. Hyvä ihmissuhde ei tarkoita sitä, että ihmiset ovat aina samaa mieltä. Eri mieltä voi olla kunnioittavasti.\n\nLuottamus syntyy yleensä ajan ja tekojen kautta. Jos ihminen lupaa jotakin ja pitää lupauksensa, luottamus voi vahvistua. Toistuva valehtelu tai toisen yksityisten asioiden levittäminen voi rikkoa luottamusta. Anteeksipyyntö ei myöskään automaattisesti korjaa kaikkea, vaan tärkeää on halu muuttaa toimintaa.\n\nSuostumus tarkoittaa vapaaehtoista ja ymmärrettyä suostumista. Painostus, uhkailu, manipulointi tai pelko eivät tee suostumuksesta aidosti vapaata. Omien rajojen tunnistaminen on yhtä tärkeää kuin toisen rajojen kunnioittaminen. Tämä koskee esimerkiksi fyysistä läheisyyttä, yksityisiä kuvia, viestejä ja sitä, miten toista puhutellaan.\n\nIhmissuhteissa voi syntyä myös vallan epätasapainoa. Jos toinen kontrolloi jatkuvasti toisen kavereita, rahaa, pukeutumista tai yhteydenpitoa, kyse ei ole vain tavallisesta erimielisyydestä. Eettisesti on tärkeää huomata, onko molemmilla todellinen mahdollisuus sanoa ei ja tehdä omia valintoja.\n\nKontrollissa analysoi tilanne viiden kysymyksen avulla: toteutuvatko kunnioitus, vapaaehtoisuus, turvallisuus, tasavertaisuus ja luottamus? Perustele sitten, mikä olisi oikeudenmukainen toimintatapa.\n\nMuistilause kontrolliin: ihmissuhteiden etiikassa keskeisiä ovat kunnioitus, luottamus, vapaaehtoisuus, turvallisuus ja tasavertaisuus. Suostumus pitää olla vapaaehtoista ja ymmärrettyä. Painostus ei ole aitoa suostumusta. Riidassa arvioi myös valtasuhteita ja sitä, onko molemmilla mahdollisuus sanoa ei. Hyvä vastaus ei syytä vain yhtä osapuolta, vaan perustelee, mikä toimintatapa suojaa ihmisarvoa ja rajoja."],["ET 7","Elämän ja kuoleman kysymykset","Elämän ja kuoleman kysymyksissä etiikka joutuu pohtimaan ihmisarvoa, itsemääräämisoikeutta, kärsimyksen vähentämistä ja elämän suojelemista. Aiheisiin voivat kuulua abortti, saattohoito, eutanasia, itsemurha ja lääketieteelliset päätökset elämän loppuvaiheessa. Näissä keskusteluissa ei yleensä ole hyödyllistä esittää asiaa vain kahden mielipiteen taisteluna. Parempi tapa on tunnistaa eri arvoja ja perusteluja.\n\nAborttia koskevassa eettisessä keskustelussa voidaan pohtia syntymättömän elämän moraalista asemaa, raskaana olevan henkilön itsemääräämisoikeutta, terveyttä ja elämäntilannetta. Saattohoidossa tavoitteena on lievittää kärsimystä ja tukea ihmistä tilanteessa, jossa parantavaa hoitoa ei enää ole. Eutanasia tarkoittaa tarkoituksellista elämän päättämistä potilaan pyynnöstä tietyissä tilanteissa. Saattohoitoa ja eutanasiaa ei pidä sekoittaa: saattohoidossa tarkoitus on hoitaa ja lievittää kärsimystä, vaikka kuolema olisi lähellä.\n\nEri eettiset teoriat voivat painottaa eri asioita. Velvollisuusetiikka voi korostaa elämän suojelemista tai periaatetta, jonka mukaan ihmistä ei saa käyttää välineenä. Seurausetiikka voi tarkastella kärsimyksen määrää ja päätöksen vaikutuksia. Hyve-etiikka voi kysyä, millainen toiminta ilmaisee myötätuntoa, viisautta ja vastuullisuutta.\n\nKontrollissa määrittele ensin käsite. Esittele vähintään kaksi perusteltua näkökulmaa, kerro niiden taustalla olevat arvot ja arvioi seurauksia. Lopuksi voit esittää oman kantasi, mutta tärkeintä on osoittaa, että ymmärrät ongelman monimutkaisuuden.\n\nMuistilause kontrolliin: elämän ja kuoleman kysymyksissä osaa erottaa abortin, saattohoidon ja eutanasian. Tunnista ihmisarvo, itsemääräämisoikeus, elämän suojeleminen ja kärsimyksen vähentäminen. Esitä vähintään kaksi näkökulmaa ja kerro niiden taustalla olevat arvot. Älä väitä, että vaikeassa bioeettisessä kysymyksessä on aina vain yksi helppo vastaus. Perustelu ratkaisee enemmän kuin mielipiteen voimakkuus."],["ET 8","Terveyden ja hyvinvoinnin etiikka","Terveyden ja hyvinvoinnin etiikassa tarkastellaan sitä, mitä tarkoittaa hyvä elämä ja miten terveyttä pitäisi edistää oikeudenmukaisesti. Hyvinvointi on laajempi asia kuin pelkkä sairauden puuttuminen. Siihen liittyvät fyysinen terveys, psyykkinen hyvinvointi, ihmissuhteet, turvallisuus, lepo, mahdollisuus osallistua ja kokemus siitä, että omalla elämällä on merkitystä.\n\nTerveydenhuollossa syntyy eettisiä kysymyksiä esimerkiksi silloin, kun resursseja on rajallisesti. Jos kaikille ei voida tarjota kaikkea heti, pitää pohtia, millä perusteella hoitoa priorisoidaan. Tärkeitä periaatteita ovat potilaan itsemääräämisoikeus, hyvän tekeminen, vahingon välttäminen ja oikeudenmukaisuus. Potilaan tietoja pitää käsitellä luottamuksellisesti.\n\nTieteellinen tutkimus on tärkeää, koska lääketieteellisiä väitteitä pitää voida testata. Samalla tutkimukseen osallistuvien oikeudet ja turvallisuus on suojattava. Terveystiedon arvioinnissa lähdekritiikki on välttämätöntä. Pelkkä sosiaalisen median video tai yksittäinen kokemus ei todista, että jokin hoito toimii kaikille.\n\nUrheilun etiikkaan liittyvät reilu peli, doping, kilpailupaineet, loukkaantumisriskit ja alaikäisten suojaaminen. Voiton tavoittelu ei oikeuta vaarantamaan terveyttä tai huijaamaan. Vastuu kuuluu urheilijan lisäksi valmentajille, seuroille ja järjestöille.\n\nKontrollissa käytä käsitteitä ihmisarvo, itsemääräämisoikeus, oikeudenmukaisuus, hyvinvointi ja vastuu. Hyvä vastaus yhdistää käsitteen konkreettiseen tilanteeseen ja näyttää, miksi ratkaisu on eettisesti perusteltu.\n\nMuistilause kontrolliin: hyvinvointi on fyysistä, psyykkistä ja sosiaalista. Terveydenhuollossa muista itsemääräämisoikeus, hyvän tekeminen, vahingon välttäminen ja oikeudenmukaisuus. Terveystiedossa arvioi lähteen luotettavuutta. Urheilussa muista reilu peli, doping, turvallisuus ja vastuu. Hyvä vastaus yhdistää käsitteen käytännön tilanteeseen ja selittää, miksi ratkaisu tukee ihmisen hyvinvointia ja ihmisarvoa."]]};const CONCEPTS={"US":[["Moraali","käsitykset hyvästä ja pahasta","Arvot","asiat, joita pidetään tärkeinä","Normit","toimintaa ohjaavat säännöt","Itsekritiikki","omien ajatusten tutkimista"],["Elämän tarkoitus","kysymys siitä, mikä tekee elämästä merkityksellistä","Kärsimys","fyysinen tai psyykkinen kokemus","Rakkaus","luottamus, kunnioitus, välittäminen ja vastuu","Merkitys","sitä voidaan löytää ihmisistä, luonnosta tai tavoitteista"],["Vanha testamentti","korostaa käskyjä ja oikeudenmukaisuutta","Armo","Jeesuksen opetuksissa korostuva teema","Kultainen sääntö","muita kohdellaan kuten itseä toivottaisiin","Moraalinen vastuu","vastuu omista valinnoista"],["Monoteismi","usko yhteen Jumalaan","Hyve","hyvä luonteenpiirre tai toimintatapa","Pahe","hyveen vastakohta","Yhteisö","eettisen toiminnan sosiaalinen ympäristö"],["Karma","tekojen seurauksiin liittyvä ajatus","Buddhalaisuus","kärsimyksen vähentämistä korostava perinne","Konfutselaisuus","perhettä ja yhteisöä korostava perinne","Bushido","kunniaan, uskollisuuteen ja velvollisuuteen liittyvä ihanne"],["Ihmisarvo","kaikkien ihmisten yhtäläisen arvon perusta","Ihmisoikeudet","kaikille kuuluvat perusoikeudet","YK:n julistus","ihmisoikeuksien yleismaailmallinen julistus","Lapsen oikeudet","oikeus erityiseen suojeluun ja kehitykseen"],["Luottamus","ihmissuhteiden tärkeä perusta","Kunnioitus","toisen arvon ja rajojen huomioiminen","Ennakkoluulottomuus","erilaisten ihmisten kohtaamista ilman perusteettomia oletuksia","Hyvä elämä","turvallisuutta, suhteita ja merkityksellisyyttä"],["Suostumus","seksuaalisuuden eettinen perusta","Itsemääräämisoikeus","oikeus päättää itseään koskevista asioista","Tasa-arvo","yhtäläisen kohtelun periaate","Saattohoito","oireiden lievittämistä elämän lopussa"],["Lähdekritiikki","tiedon luotettavuuden arviointia","Yksityisyys","henkilökohtaisten tietojen ja elämän suojaa","Vallankäyttö","päätöksiin vaikuttamista, johon liittyy vastuu","Eriarvoisuus","ihmisten erilaisten mahdollisuuksien ongelma"],["Ympäristöetiikka","ihmisen ja luonnon suhteen moraalista tarkastelua","Kestävä elämäntapa","tulevat sukupolvet hu
