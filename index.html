const CHAPTER_INFO={"US 1":["### Etiikka, moraali ja arvot","Etiikka on filosofinen tapa tutkia moraalia: se kysyy, mikä on oikein tai väärin, miksi jokin teko olisi hyvä tai huono ja millä perusteilla väitettä voidaan puolustaa. Moraali taas tarkoittaa käytännön käsityksiä ja toimintatapoja, joita ihmisellä tai yhteisöllä on hyvästä ja pahasta. Arvot kertovat, mitä pidämme tärkeänä, esimerkiksi oikeudenmukaisuutta, vapautta, turvallisuutta tai rehellisyyttä.","### Miten eettistä ongelmaa tutkitaan?","Kun kohtaat eettisen ongelman, erottele ensin tosiasiat mielipiteistä. Sen jälkeen tunnista, ketkä tilanteessa ovat osapuolia, mitä arvoja ja oikeuksia tilanteeseen liittyy ja millaisia vaihtoehtoja on olemassa. Lopuksi arvioi vaihtoehtojen seurauksia ja perustele oma johtopäätöksesi. Hyvä koevastaus ei ole vain mielipide, vaan mielipide, jota tuetaan käsitteillä ja perusteluilla.","### Maailmankuva ja maailmankatsomus","Maailmankuva tarkoittaa käsityksiä siitä, millainen maailma ja ihminen ovat. Maailmankatsomus on laajempi kokonaisuus, johon kuuluu myös käsitys siitä, mikä elämässä on tärkeää ja miten pitäisi elää. Uskonto voi vaikuttaa maailmankatsomukseen, mutta maailmankatsomus voi olla myös uskonnollinen, ateistinen tai esimerkiksi agnostinen.","### Kokeessa muista","Tärkeää on osata erottaa toisistaan moraali, etiikka, arvot ja normit. Muista myös, että eettisessä pohdinnassa voi olla useita perusteltuja näkökulmia. Eri mieltä oleminen ei itsessään tee vastauksesta väärää, jos perustelut ovat selkeitä ja liittyvät kysymykseen.","### Arjen esimerkki","Eettisiä kysymyksiä tulee vastaan tavallisissa tilanteissa: koulussa, kaverisuhteissa, somessa ja silloin, kun joku tarvitsee apua. Esimerkiksi jos huomaat luokkakaverin joutuvan kiusatuksi, voit pohtia sekä omaa toimintavapauttasi että vastuutasi muita kohtaan. Eettinen arviointi ei tarkoita sitä, että kaikesta pitäisi olla samaa mieltä. Olennaista on tunnistaa perustelut, kuunnella muita ja arvioida, ovatko omat perustelut johdonmukaisia. Tunne voi olla tärkeä lähtökohta, mutta pelkkä tunne ei vielä kerro, mikä ratkaisu on oikeudenmukainen.","### Kokeessa muista","Kun vastaat eettiseen kysymykseen, käytä käsitteitä täsmällisesti. Kerro ensin, mistä ongelmassa on kyse. Nimeä sen jälkeen vähintään yksi arvo, oikeus tai moraalinen periaate. Esittele vaihtoehtoja ja niiden seurauksia ja tee lopuksi perusteltu johtopäätös. Hyvä vastaus voi tunnistaa myös vastakkaisen näkökulman. Muista erottaa toisistaan laillinen ja moraalisesti hyvä toiminta: jokin teko voi olla laillinen, mutta siitä voidaan silti keskustella eettisesti."],"US 2":["### Elämän tarkoitus ja merkityksellisyys","Elämän tarkoitusta koskeva kysymys on filosofinen ja maailmankatsomuksellinen. Jotkut löytävät tarkoituksen ihmissuhteista, uskonnosta, työstä, oppimisesta, auttamisesta tai tavoitteista. Toiset ajattelevat, ettei elämälle ole valmiiksi annettua tarkoitusta, vaan ihminen rakentaa merkitystä itse. Kokeessa kannattaa erottaa kysymys siitä, mitä elämä merkitsee ihmiselle, kysymyksestä siitä, onko olemassa jokin kaikille yhteinen tarkoitus.","### Kärsimys ja kuolema","Kärsimystä voidaan tarkastella fyysisenä kipuna, psyykkisenä kokemuksena tai sosiaalisena vaikeutena. Uskonnot voivat antaa kärsimykselle erilaisia selityksiä ja tapoja käsitellä sitä. Kuolemaan liittyy sekä käytännöllisiä että maailmankatsomuksellisia kysymyksiä: mitä kuolema merkitsee, onko kuoleman jälkeen jotakin ja miten kuolevaa ihmistä pitäisi kohdella?","### Rakkaus ja ihmissuhteet","Rakkauteen liittyy tunteen lisäksi vastuuta, luottamusta, kunnioitusta ja toisen rajojen huomioimista. Eettisessä tarkastelussa voidaan kysyä, ovatko osapuolet tasavertaisia, voiko jokainen ilmaista tahtonsa vapaasti ja kohdellaanko kaikkia kunnioittavasti.","### Kokeessa muista","Osaa antaa ainakin kaksi erilaista näkökulmaa samaan elämänkysymykseen. Hyvä vastaus kertoo ensin käsitteen, sitten näkökulmat ja lopuksi oman perustellun johtopäätöksen.","### Elämän tarkoitus ja merkitys","Kysymys elämän tarkoituksesta liittyy siihen, mitä ihminen pitää arvokkaana ja merkityksellisenä. Uskonnot voivat tarjota vastauksia esimerkiksi Jumalasta, pelastuksesta, jälleensyntymästä tai elämästä osana suurempaa kokonaisuutta. Myös ei-uskonnollinen ihminen voi löytää merkitystä läheisistä ihmissuhteista, oppimisesta, luonnosta, työstä tai muiden auttamisesta. On tärkeää ymmärtää, että merkityksellinen elämä ei tarkoita kaikille samaa asiaa. Ihmisen käsitys voi myös muuttua elämän aikana kokemusten ja elämäntilanteen muuttuessa.","### Kärsimys ja kuolema","Kärsimys herättää vaikeita kysymyksiä oikeudenmukaisuudesta, vastuusta ja elämän arvosta. Uskonnollisissa perinteissä kärsimystä voidaan tulkita esimerkiksi koettelemuksena, osana ihmisen rajallisuutta tai kysymyksenä, johon ei ole yksinkertaista vastausta. Kuolemaan liittyvät näkemykset vaihtelevat suuresti: jotkut uskovat kuolemanjälkeiseen elämään, toiset jälleensyntymään ja toiset siihen, että tietoisuus päättyy kuolemaan. Kontrollissa tärkeää on osata vertailla näkemyksiä ilman, että niitä sekoitetaan toisiinsa."],"US 3":["### Raamatun rakenne","Raamattu on kristinuskon pyhä kirjakokoelma. Se jakautuu Vanhaan ja Uuteen testamenttiin. Vanha testamentti sisältää Israelin kansan historiaan, uskoon, viisausperinteeseen ja profeettoihin liittyviä tekstejä. Uusi testamentti keskittyy Jeesuksen elämään ja opetuksiin sekä varhaisen kristinuskon syntyyn.","### Eettiset periaatteet","Raamatun eettisissä teksteissä esiintyvät esimerkiksi oikeudenmukaisuus, lähimmäisenrakkaus, heikommista huolehtiminen, anteeksianto ja vastuu omista teoista. Jeesuksen opetuksissa korostuu ajatus siitä, että ulkoisen toiminnan lisäksi myös ihmisen asenne ja tarkoitus ovat moraalisesti merkityksellisiä.","### Kultainen sääntö","Kultainen sääntö voidaan tiivistää ajatukseen, että muita ihmisiä tulee kohdella niin kuin itse toivoisi tulevansa kohdelluksi. Se tarjoaa käytännöllisen tavan tarkastella arkisia tilanteita: ennen omaa toimintaa voi kysyä, hyväksyisinkö saman toiminnan, jos olisin itse toinen osapuoli.","### Kokeessa muista","Osaa selittää, mitä tarkoittavat armo, anteeksianto, lähimmäisenrakkaus ja kultainen sääntö. Älä sekoita Raamatun eri osia keskenään: Vanha ja Uusi testamentti muodostavat yhdessä Raamatun.","### Vanha ja Uusi testamentti","Raamatun kaksi pääosaa muodostavat historiallisen ja uskonnollisen kokonaisuuden, mutta niiden tekstit ovat syntyneet eri aikoina ja eri tilanteissa. Vanhan testamentin keskeisiä aiheita ovat liitto, käskyt, oikeudenmukaisuus ja ihmisen suhde Jumalaan. Uudessa testamentissa Jeesuksen elämä ja opetukset ovat keskeisiä. Evankeliumit kertovat Jeesuksesta, ja muut Uuden testamentin tekstit käsittelevät varhaisen kristinuskon uskoa ja elämää. Eettisiä opetuksia tulee tarkastella myös tekstien asiayhteydessä.","### Jeesuksen etiikka","Jeesuksen opetuksissa korostuvat lähimmäisenrakkaus, anteeksianto, armo ja heikommassa asemassa olevien huomioiminen. Vuorisaarnassa käsitellään esimerkiksi vihamielisyyttä, kostoa, vihollisen rakastamista ja toisten tuomitsemista. Kultainen sääntö tiivistää yhden keskeisen ajatuksen: toista ihmistä tulisi kohdella tavalla, jolla itse toivoisi tulevansa kohdelluksi. Kontrollivastauksessa kannattaa antaa konkreettinen esimerkki siitä, miten periaate voisi näkyä nykyajan koulussa tai yhteiskunnassa."],"US 4":["### Kolme Lähi-idästä lähtöisin olevaa uskontoa","Juutalaisuus, kristinusko ja islam ovat monoteistisia uskontoja, eli niissä uskotaan yhteen Jumalaan. Niillä on historiallisia yhteyksiä ja yhteisiä hahmoja ja kertomusperinteitä, mutta niiden opetukset, rituaalit ja painotukset eivät ole samoja.","### Etiikan yhteisiä teemoja","Oikeudenmukaisuus, rehellisyys, lähimmäisestä huolehtiminen ja yhteisön vastuu ovat esimerkkejä teemoista, joita voidaan löytää kaikista kolmesta perinteestä. Yhteinen teema ei kuitenkaan tarkoita, että kaikki uskonnot ratkaisisivat eettiset kysymykset samalla tavalla.","### Hyveet ja paheet","Hyve on hyväksi katsottu luonteenpiirre tai toimintatapa, esimerkiksi rehellisyys, rohkeus tai oikeudenmukaisuus. Pahe tarkoittaa hyveen vastakohtaa. Hyve-etiikassa huomio kiinnittyy erityisesti siihen, millaiseksi ihmiseksi tekojen toistaminen tekee meistä.","### Kokeessa muista","Kun vertailet uskontoja, käytä rakennetta: yhteinen piirre → ero → esimerkki. Näin vastaus on tarkempi kuin pelkkä luettelo.","### Kolmen monoteistisen uskonnon yhteisiä piirteitä","Juutalaisuus, kristinusko ja islam ovat historiallisesti toisiinsa liittyviä uskontoja. Niissä uskotaan yhteen Jumalaan, mutta käsitykset Jumalasta, profeetoista, pyhistä teksteistä ja uskonnollisesta elämästä eivät ole samanlaisia. Juutalaisuudessa Toora ja liitto ovat keskeisiä. Kristillisyydessä Jeesus Kristus on uskon keskus. Islamissa Koraani ja profeetta Muhammad ovat keskeisiä. Kaikkien kolmen perinteissä esiintyy eettisiä opetuksia esimerkiksi oikeudenmukaisuudesta, hyvän tekemisestä ja lähimmäisen huomioimisesta.","### Vertailu","Uskontoja verrattaessa vältä liian yleisiä väitteitä, kuten että kaikki niiden kannattajat ajattelisivat samalla tavalla. Uskontojen sisällä on erilaisia suuntauksia ja tulkintoja. Kontrollissa kannattaa ensin kertoa yhteinen piirre ja sen jälkeen yksi selkeä ero. Esimerkiksi hyvän tekeminen on yhteinen teema, mutta sen perustelut ja uskonnollinen toteutus voivat vaihdella. Vertailu tarkoittaa siis sekä yhtäläisyyksien että erojen tunnistamista."],"US 5":["### Kaukoidän perinteiden näkökulma","Hindulaisuus ja buddhalaisuus ovat Intian alueelta lähtöisin olevia uskonnollisia perinteitä, kun taas konfutselaisuus liittyy Kiinan filosofiseen ja yhteiskunnalliseen perinteeseen. Näissä perinteissä eettistä elämää voidaan tarkastella esimerkiksi tekojen seurausten, kärsimyksen vähentämisen, itsekurin, ihmissuhteiden ja yhteisön tasapainon kautta.","### Karma ja toiminnan seuraukset","Karma liittyy ajatukseen siitä, että teoilla on seurauksia. Koulutasolla on tärkeää ymmärtää, ettei sana tarkoita vain sattumaa tai kohtaloa, vaan liittyy moraalisesti merkitykselliseen toimintaan ja sen seurauksiin uskonnollisessa ajattelussa.","### Buddhalainen näkökulma","Buddhalaisuudessa keskeinen kysymys on kärsimys ja siitä vapautuminen. Eettinen elämä liittyy haitallisen toiminnan vähentämiseen, myötätuntoon ja oman toiminnan tarkasteluun. Tavoitteena on vähentää kärsimystä eikä lisätä sitä.","### Konfutselaisuus ja bushido","Konfutselaisuudessa korostuvat ihmissuhteet, perhe, vastuu ja yhteiskunnallinen järjestys. Bushido on japanilaiseen samurai-kulttuuriin liittynyt ihanne, jossa korostuivat esimerkiksi kunnia, uskollisuus, rohkeus, itsehillintä ja velvollisuus.","### Kokeessa muista","Osaa yhdistää jokaisen perinteen tärkeimpään eettiseen ajatukseen ja anna yksi konkreettinen esimerkki.","### Karma ja toiminnan seuraukset","Karman käsite liittyy erityisesti intialaisiin uskonnollisiin perinteisiin, mutta sen merkitys vaihtelee traditioittain. Yksinkertaistettuna sillä tarkoitetaan tekojen ja niiden seurausten välistä yhteyttä. Hindulaisuudessa karma liittyy esimerkiksi jälleensyntymään ja ihmisen asemaan samsaran eli jälleensyntymien kiertokulussa. Buddhalaisuudessa karmalla tarkoitetaan erityisesti tahdonalaisten tekojen moraalisia seurauksia. Käsitettä ei siksi pidä kuvata pelkkänä ajatuksena siitä, että 'hyvä ihminen saa aina hyvää takaisin'.","### Buddhalaisuus, hindulaisuus ja konfutselaisuus","Buddhalaisuudessa keskeisiä ovat kärsimyksen ymmärtäminen ja siitä vapautumisen tie, mukaan lukien kahdeksanosainen polku. Hindulaisuus on monimuotoinen perinne, jossa esiintyy erilaisia jumalakäsityksiä, rituaaleja ja filosofisia suuntauksia. Konfutselaisuus painottaa yhteiskunnallisia suhteita, perhettä, kasvatusta ja hyvää käytöstä. Kaukoidän perinteitä vertaillessa kannattaa huomioida, että uskonto, filosofia ja kulttuuri voivat limittyä toisiinsa."],"US 6":["### Ihmisarvo on lähtökohta","Ihmisoikeuksien perusajatus on, että jokaisella ihmisellä on ihmisarvo riippumatta esimerkiksi iästä, taustasta, mielipiteistä tai asemasta. Oikeuksia ei pitäisi joutua ansaitsemaan olemalla tietynlainen ihminen.","### Oikeudet ja velvollisuudet","Ihmisoikeudet suojaavat yksilöä ja luovat yhteiskunnalle velvollisuuksia. Esimerkiksi oikeus koulutukseen tarkoittaa, että yhteiskunnan tulee luoda edellytyksiä koulutukselle. Oikeuksien käyttäminen ei kuitenkaan tarkoita, että muiden oikeudet voisi unohtaa.","### Lapsen oikeudet","Lapsella on oikeus erityiseen suojeluun, huolenpitoon, koulutukseen ja kehitykseen. Lapsen näkökulman huomioiminen on tärkeää, koska lapsella ei aina ole samoja mahdollisuuksia puolustaa omia oikeuksiaan kuin aikuisella.","### Kokeessa muista","Osaa selittää ihmisarvon, ihmisoikeuden ja tasa-arvon erot. Hyvä esimerkki tekee vastauksesta konkreettisen.","### Ihmisarvo ja oikeudet","Ihmisoikeuksien perusajatus on, että jokaisella ihmisellä on arvo riippumatta esimerkiksi kansallisuudesta, uskonnosta, sukupuolesta, varallisuudesta tai mielipiteistä. Oikeudet suojaavat ihmisen vapautta ja turvallisuutta sekä mahdollistavat osallistumisen yhteiskuntaan. Oikeuksiin liittyy myös kysymys vastuusta: omien oikeuksien käyttäminen ei saa tarkoittaa muiden oikeuksien perusteetonta loukkaamista. Ihmisoikeudet ovat universaali periaate, vaikka niiden toteutumisesta voidaan käydä yhteiskunnallista keskustelua.","### Lapsen oikeudet","Lapsella on oikeus esimerkiksi turvallisuuteen, huolenpitoon, koulutukseen ja kehitykseen. Aikuisilla ja yhteiskunnalla on vastuu luoda olosuhteet, joissa lapsen oikeudet toteutuvat. Kokeessa voi olla hyödyllistä erottaa oikeus, laki ja moraalinen velvollisuus. Oikeus kertoo, mitä ihmisellä tulee olla mahdollisuus saada tai tehdä; laki on yhteiskunnan säätämä sääntö; moraalinen velvollisuus perustuu eettiseen arvioon siitä, miten pitäisi toimia."],"US 7":["### Ihminen suhteissa muihin","Ihminen tekee eettisiä valintoja aina suhteessa muihin ihmisiin ja ympäristöön. Siksi etiikka ei koske vain suuria yhteiskunnallisia päätöksiä, vaan myös arjen tilanteita: miten puhumme toisille, pidämmekö lupauksemme ja kunnioitammeko toisen rajoja.","### Kunnioitus ja luottamus","Luottamus syntyy siitä, että toisen voi olettaa toimivan rehellisesti ja kunnioittavasti. Kunnioitus tarkoittaa toisen ihmisarvon, mielipiteiden ja rajojen huomioimista, vaikka olisimme eri mieltä.","### Kulttuurien kohtaaminen","Kulttuurien kohtaamisessa ennakkoluulottomuus ei tarkoita, että kaikesta pitäisi olla samaa mieltä. Se tarkoittaa halua kuunnella, tarkistaa omia oletuksia ja erottaa yksittäinen ihminen häntä koskevista stereotypioista.","### Kokeessa muista","Käytä sanoja ihmisarvo, kunnioitus, luottamus, vastuu ja rajat, kun ne sopivat tilanteeseen. Muista perustella, miksi jokin toimintatapa on eettisesti hyvä.","### Ihminen suhteessa muihin","Ihmisen moraalinen toiminta tapahtuu aina jossain sosiaalisessa ympäristössä. Perhe, ystävät, koulu, harrastukset, media ja kulttuuri vaikuttavat siihen, miten opimme suhtautumaan muihin. Tämä ei kuitenkaan tarkoita, että ihminen olisi täysin muiden määrittelemä. Itsenäinen ajattelu antaa mahdollisuuden arvioida omaksuttuja tapoja kriittisesti. Hyvä ihmissuhde perustuu vastavuoroisuuteen: molempien tarpeita, rajoja ja ihmisarvoa pitää kunnioittaa.","### Kulttuurien kohtaaminen","Kulttuurien välisessä kohtaamisessa on tärkeää erottaa ennakkoluulo, stereotypia ja todellinen tieto. Yksittäisen ihmisen käyttäytymisestä ei voi tehdä päätelmiä kokonaisesta kulttuurista tai uskonnosta. Eettisesti kestävä toiminta tarkoittaa kuuntelemista, kunnioittavaa kysymistä ja valmiutta korjata omia käsityksiä. Samalla muiden kulttuurien kunnioittaminen ei tarkoita sitä, että kaikkea toimintaa pitäisi hyväksyä: myös kulttuurisiin käytäntöihin voidaan soveltaa ihmisoikeuksia ja eettistä arviointia."],"US 8":["### Elämänkaari","Elämänkaarien etiikka tarkastelee moraalisia kysymyksiä eri elämänvaiheissa. Kysymykset muuttuvat iän ja tilanteen mukaan, mutta ihmisarvon periaate pysyy keskeisenä alusta loppuun.","### Seksuaalietiikka","Seksuaalietiikassa keskeisiä ovat vapaaehtoinen suostumus, turvallisuus, vastuu ja omien sekä muiden rajojen kunnioittaminen. Suostumuksen tulee olla vapaaehtoista eikä painostus tee tilanteesta eettisesti hyväksyttävää.","### Terveydenhuollon etiikka","Itsemääräämisoikeus tarkoittaa, että ihmisellä on oikeus osallistua itseään koskeviin päätöksiin. Tasa-arvo liittyy siihen, että ihmisiä kohdellaan oikeudenmukaisesti. Luottamuksellisuus suojaa potilaan yksityisiä tietoja. Hyvän tekeminen tarkoittaa pyrkimystä edistää potilaan hyvinvointia.","### Elämän loppu","Saattohoidossa tavoitteena on lievittää oireita ja tukea ihmistä hänen elämänsä lopussa. Eettisessä keskustelussa erotellaan usein aktiiviset hoitotoimet, hoidon rajaaminen, oireiden lievitys ja eutanasia.","### Kokeessa muista","Kun vastaat elämän alkuun tai loppuun liittyvään kysymykseen, esitä vähintään kaksi näkökulmaa ja perustele, mitä arvoja tai oikeuksia ne suojaavat.","### Elämän alku ja loppu","Elämänkaaren etiikassa kysytään, miten ihmisarvoa ja oikeuksia tulisi suojella elämän eri vaiheissa. Elämän alkuun liittyvissä keskusteluissa voidaan pohtia syntymättömän elämän moraalista asemaa sekä raskaana olevan henkilön itsemääräämisoikeutta. Elämän loppuun liittyvissä kysymyksissä keskustellaan esimerkiksi hyvästä kuolemasta, saattohoidosta ja itsemääräämisestä. Näissä kysymyksissä on tärkeää tunnistaa, että ihmisillä voi olla erilaisia uskonnollisia, filosofisia ja juridisia perusteluja.","### Eettinen perustelu","Vaikeissa elämänkaarikysymyksissä pelkkä mielipide ei riitä hyvään koevastaukseen. Voit tarkastella esimerkiksi ihmisarvoa, autonomiaa, elämän suojelemista, kärsimyksen vähentämistä ja yhdenvertaisuutta. Sen jälkeen vertaile, mitä eri periaatteet tarkoittavat käytännössä. Muista, että juridinen kysymys ja eettinen kysymys eivät ole sama asia: laki kertoo, mitä yhteiskunnassa on sallittu tai kielletty, kun taas etiikka tutkii, mitä pitäisi pitää oikeana tai vääränä."],"US 9":["### Etiikka yhteiskunnassa","Yhteiskunnassa ihmisten toimintaa ohjaavat lait, säännöt, instituutiot ja yhteiset käytännöt. Laki ja moraali eivät kuitenkaan ole sama asia: jokin voi olla laillista mutta silti moraalisesti kyseenalaista, tai moraalisesti perusteltua mutta lain mukaan kiellettyä.","### Valta ja vastuu","Vallankäyttö tarkoittaa mahdollisuutta vaikuttaa ihmisten toimintaan tai päätöksiin. Mitä enemmän valtaa ihmisellä tai instituutiolla on, sitä tärkeämpää on läpinäkyvyys, vastuu ja muiden oikeuksien suojaaminen.","### Media ja teknologia","Lähdekritiikki auttaa arvioimaan, kuka tiedon on tuottanut, mihin väite perustuu, milloin se on julkaistu ja onko muita luotettavia lähteitä. Teknologia tuo uusia mahdollisuuksia mutta myös yksityisyyteen, tekoälyyn ja väärään tietoon liittyviä eettisiä kysymyksiä.","### Kokeessa muista","Erota toisistaan laki, moraali ja yhteiskunnallinen mielipide. Kun käsittelet mediaa, mainitse lähdekritiikki ja yksityisyys, jos ne liittyvät tilanteeseen.","### Laki, valta ja vastuu","Yhteiskunta tarvitsee yhteisiä sääntöjä, jotta ihmisten oikeudet ja turvallisuus voidaan turvata. Demokratiaan liittyy ajatus siitä, että kansalaiset voivat osallistua päätöksentekoon esimerkiksi äänestämällä ja keskustelemalla. Vallankäyttöön liittyy kuitenkin aina vastuu: päätösten vaikutuksia pitää arvioida myös niiden kannalta, joilla on vähemmän valtaa. Oikeudenmukaisuus voi tarkoittaa esimerkiksi yhdenvertaista kohtelua, mutta joskus heikommassa asemassa olevien erityinen tukeminen voi olla tarpeen.","### Talouden etiikka","Taloudellisiin päätöksiin liittyy kysymyksiä oikeudenmukaisuudesta, työn arvosta, kuluttamisesta ja luonnonvarojen käytöstä. Kuluttaja voi pohtia, miten tuotteen hinta, tuotanto-olosuhteet ja ympäristövaikutukset liittyvät toisiinsa. Yrityksillä on myös vastuuta työntekijöistä, asiakkaista ja ympäristöstä. Kontrollissa kannattaa erottaa toisistaan kuvaus siitä, miten talous toimii, ja eettinen arvio siitä, miten talouden pitäisi toimia."],"US 10":["### Ihmisen suhde luontoon","Ympäristöetiikka kysyy, millainen moraalinen suhde ihmisellä pitäisi olla luontoon, eläimiin ja tuleviin sukupolviin. Luonto voidaan nähdä välineenä ihmisille, mutta myös itsessään arvokkaana kokonaisuutena.","### Kestävyys","Kestävä elämäntapa pyrkii tyydyttämään nykyiset tarpeet vaarantamatta tulevien sukupolvien mahdollisuuksia. Käytännössä tämä voi liittyä kulutukseen, energiaan, liikkumiseen, ruokaan ja luonnonvarojen käyttöön.","### Luonnon monimuotoisuus ja eläimet","Luonnon monimuotoisuuden väheneminen vaikuttaa ekosysteemeihin ja niiden toimintaan. Eläinten kohdalla voidaan kysyä, onko niillä itseisarvoa ja kuinka paljon niiden kärsimystä pitäisi huomioida ihmisten päätöksissä.","### Kokeessa muista","Hyvä ympäristöetiikan vastaus yhdistää oman toiminnan, ympäristön vaikutukset ja tulevien sukupolvien näkökulman.","### Ihminen osana luontoa","Ympäristöetiikka kysyy, onko luonnolla arvoa itsessään vai ennen kaikkea siksi, että se on ihmiselle hyödyllinen. Ihmiskeskeisessä näkökulmassa painottuvat ihmisten tarpeet, kun taas luontokeskeisemmissä näkökulmissa myös eläimillä, ekosysteemeillä tai luonnolla voidaan katsoa olevan omaa arvoa. Näkökulmat vaikuttavat siihen, miten suhtaudumme metsien hakkuisiin, eläinten käyttöön, luonnonsuojeluun ja luonnonvarojen kulutukseen.","### Ilmastonmuutos ja vastuu","Ilmastonmuutos on sekä ympäristöön että yhteiskuntaan liittyvä eettinen kysymys. Vastuun jakamista voidaan tarkastella yksilön, yritysten ja valtioiden näkökulmasta. Kysymys on myös sukupolvien välisestä oikeudenmukaisuudesta: nykyiset päätökset vaikuttavat ihmisiin, jotka elävät tulevaisuudessa. Kokeessa hyvä vastaus yhdistää ympäristövaikutuksen ja eettisen periaatteen, esimerkiksi vastuun, oikeudenmukaisuuden tai kestävyyden."],"ET 1":["### Itsenäinen ajattelu","Itsenäinen ajattelu ei tarkoita sitä, että jokainen mielipide olisi yhtä hyvä. Se tarkoittaa kykyä muodostaa kanta itse, tarkistaa perustelut ja muuttaa mielipidettä, jos uudet perustelut tai todisteet sitä vaativat.","### Kriittinen ajattelu","Kriittinen ajattelu kysyy esimerkiksi: Mihin väite perustuu? Onko lähde luotettava? Onko päättelyssä virhe? Mitä vastakkaisesta näkökulmasta voisi sanoa? Filosofinen keskustelu harjoittaa juuri tätä taitoa.","### Sokrates","Sokrates tunnetaan kysymysten esittämisestä ja siitä, että hän haastoi ihmisiä tutkimaan omia käsityksiään. Hänen menetelmästään voi oppia, että hyvä kysymys voi paljastaa, ettei omaa väitettä ole vielä perusteltu riittävästi.","### Kokeessa muista","Erota mielipide, perustelu ja fakta. Perusteltu mielipide sisältää väitteen lisäksi syyn, joka tukee sitä.","### Miten kriittinen ajattelu toimii?","Kriittinen ajattelu ei tarkoita kaiken epäilemistä, vaan väitteiden tutkimista ennen niiden hyväksymistä. Kysy, mikä väite tarkalleen on, mihin se perustuu ja onko perustelu looginen. Erota fakta, tulkinta, mielipide ja ennustus. Mieti myös, voisiko samaa aineistoa tulkita toisella tavalla. Hyvä ajattelija pystyy muuttamaan kantaansa, jos uudet perustelut ovat parempia.","### Argumentointi","Argumentissa on yleensä väite ja sitä tukevat perustelut. Esimerkiksi 'Koulussa pitäisi olla enemmän liikuntaa' on väite, mutta sen tueksi tarvitaan perusteluja ja mahdollisesti näyttöä. Vastaväitteiden huomioiminen tekee argumentista vahvemman. Kontrollissa kannattaa kirjoittaa kokonaisia perusteluja eikä vain 'olen samaa mieltä'."],"ET 2":["### Arvot, normit ja hyveet","Arvot ilmaisevat, mitä pidämme tärkeänä. Normit ovat sääntöjä tai odotuksia siitä, miten pitäisi toimia. Hyve on hyvä luonteenpiirre tai toimintatapa, jota ihminen pyrkii harjoittamaan toistuvasti.","### Arvoristiriita","Joskus kaksi tärkeää arvoa joutuu ristiriitaan. Esimerkiksi vapaus ja turvallisuus voivat vetää eri suuntiin. Eettisessä pohdinnassa ei riitä sanoa, että molemmat ovat tärkeitä, vaan pitää arvioida, kumpaa tilanteessa painotetaan ja miksi.","### Merkityksellinen elämä","Hyvä elämä voidaan ymmärtää monella tavalla. Jollekin tärkeintä on läheiset ihmiset, toiselle oppiminen, auttaminen, luovuus tai itsenäisyys. ET:n näkökulmasta olennaista on osata perustella oma näkemys ja ymmärtää myös muiden perusteltuja näkemyksiä.","### Kokeessa muista","Osaa antaa omat esimerkit arvosta, normista ja hyveestä sekä selittää, miten ne eroavat toisistaan.","### Arvot ja hyveet","Arvo kertoo, mitä pidämme tärkeänä. Arvoja voivat olla esimerkiksi vapaus, turvallisuus, tasa-arvo, rehellisyys ja yhteisöllisyys. Arvot voivat joutua ristiriitaan: esimerkiksi täydellinen vapaus ja kaikkien turvallisuus eivät aina toteudu samassa tilanteessa. Hyve tarkoittaa hyvänä pidettyä luonteenpiirrettä tai toimintatapaa, kuten rohkeutta, kohtuullisuutta tai oikeudenmukaisuutta. Hyve-etiikka kysyy, millainen ihminen meidän pitäisi olla.","### Merkityksellinen elämä","Merkityksellisyys ei ole sama asia kuin jatkuva onnellisuus. Ihmisen elämässä voi olla vaikeuksia ja silti kokemus siitä, että elämässä on tarkoitus. Merkitystä voidaan löytää ihmissuhteista, tavoitteista, vastuusta, oppimisesta, luovuudesta tai muiden auttamisesta. ET:ssä on tärkeää osata tarkastella useita mahdollisia vastauksia ja perustella oma näkemys."],"ET 3":["### Vapaus ja vastuu","Vapaus liittyy mahdollisuuteen tehdä valintoja, mutta täydellistä vapautta ei käytännössä ole. Ihmisen toimintaan vaikuttavat esimerkiksi lait, muiden oikeudet, oma elämäntilanne ja ympäristö. Eettinen vastuu liittyy siihen, kuinka paljon ihminen pystyy vaikuttamaan omaan toimintaansa.","### Valinnan arviointi","Kun arvioit päätöstä, tarkastele vaihtoehtoja, tarkoitusta, seurauksia ja sitä, miten päätös vaikuttaa muihin. Hyvä vastaus osoittaa, että olet huomannut tilanteen monimutkaisuuden.","### Kokeessa muista","Älä kirjoita vain \"ihminen on vapaa\" tai \"ihminen ei ole vapaa\". Selitä, missä mielessä ihminen on vapaa ja mitkä tekijät rajoittavat vapautta.","### Vapaus ei tarkoita rajattomuutta","Vapaus voidaan ymmärtää mahdollisuutena tehdä valintoja ilman tarpeetonta pakkoa. Samalla ihmisen toiminta tapahtuu aina muiden ihmisten kanssa, joten vapaudella on rajansa. Esimerkiksi sananvapaus ei tarkoita, että toista ihmistä saa vahingoittaa miten tahansa. Vastuu liittyy siihen, että ihminen joutuu arvioimaan tekojensa seurauksia ja vaikutuksia muihin.","### Vaikuttavat tekijät","Päätöksiin vaikuttavat biologiset tarpeet, tunteet, kasvatus, ympäristö, taloudellinen tilanne, kaverit ja media. Näiden vaikutusten tunnistaminen auttaa arvioimaan, kuinka itsenäinen jokin päätös todella on. Kokeessa kannattaa välttää liian yksinkertaista ajatusta, että ihminen on joko täysin vapaa tai täysin muiden ohjaama."],"ET 4":["### Seurausetiikka","Seurausetiikassa teon moraalista arvoa arvioidaan sen seurausten perusteella. Utilitarismissa tavoitteena on mahdollisimman suuri kokonais-hyvinvointi. Käytännössä tämä tarkoittaa, että päätöksessä huomioidaan mahdollisimman monen ihmisen hyvinvointi.","### Dilemmat","Eettisessä dilemmassa vaihtoehdot voivat olla ristiriidassa: yhden vaihtoehdon hyöty voi tarkoittaa toisen haittaa. Siksi päätöstä pitää tarkastella useasta näkökulmasta eikä vain ensimmäisenä mieleen tulevan seurauksen perusteella.","### Kokeessa muista","Kirjoita selkeästi: teko → seuraukset → keihin vaikutus kohdistuu → kokonaisarvio → oma johtopäätös.","### Seurausten vertailu","Seurausetiikassa tekoa arvioidaan sen vaikutusten perusteella. Yksi vaihtoehto voi tuottaa hyvää yhdelle mutta haittaa monelle muulle. Siksi seurauksia kannattaa tarkastella usean henkilön ja usean aikavälin näkökulmasta. Utilitaristisessa ajattelussa tavoitteena on mahdollisimman suuri kokonaismäärä hyvää tai hyvinvointia. Käytännössä kaikkia seurauksia ei kuitenkaan aina voida tietää etukäteen.","### Esimerkkitilanne","Jos päätöksellä voidaan säästää aikaa mutta samalla aiheuttaa haittaa toiselle, seurausetiikka kysyy, ovatko hyödyt suurempia kuin haitat. Hyvässä vastauksessa ei vain luetella seurauksia, vaan verrataan niiden merkitystä ja todennäköisyyttä. Myös epävarmuus on hyvä mainita."],"ET 5":["### Sananvapaus","Sananvapaus suojaa oikeutta ilmaista mielipiteitä ja vastaanottaa tietoa. Se ei kuitenkaan tarkoita, että jokainen julkaisu olisi automaattisesti hyväksyttävä tai että muiden oikeuksia voisi loukata ilman seurauksia.","### Lähdekritiikki verkossa","Verkossa tietoa julkaisee suuri joukko ihmisiä ja organisaatioita. Tarkista kirjoittaja, lähde, päivämäärä, tarkoitus ja se, löytyykö väitteelle tukea muualta. Erityisesti vahvoja tunteita herättävät väitteet kannattaa tarkistaa useasta lähteestä.","### Yksityisyys","Kuvien, nimien ja henkilötietojen jakamiseen liittyy vastuu. Toisen ihmisen yksityisyyttä ei pidä sivuuttaa vain siksi, että materiaali on helppo julkaista.","### Kokeessa muista","Kun vertaat sananvapautta ja vastuuta, osoita molemmat puolet. Hyvä vastaus ei puolusta vain yhtä arvoa, vaan selittää niiden välisen jännitteen.","### Sananvapaus käytännössä","Sananvapaus mahdollistaa mielipiteiden, tiedon ja kritiikin ilmaisemisen. Se on tärkeä demokraattiselle yhteiskunnalle, mutta siihen liittyy myös vastuuta. Verkossa julkaistu sisältö voi levitä nopeasti ja vaikuttaa toisiin ihmisiin pitkään. Siksi ennen jakamista kannattaa arvioida lähde, väitteen perustelut ja mahdolliset seuraukset.","### Media ja disinformaatio","Medianlukutaito tarkoittaa kykyä arvioida tietoa kriittisesti. Tarkista esimerkiksi kuka tiedon julkaisi, milloin se julkaistiin, mihin väite perustuu ja löytyykö sama tieto luotettavista lähteistä. Otsikko voi olla tarkoituksella provosoiva, eikä yksittäinen kuva tai video aina kerro koko asiayhteyttä. Kontrollissa kannattaa käyttää käsitteitä kuten lähdekritiikki, disinformaatio, yksityisyys ja vastuu."],"ET 6":["### Kunnioittavat ihmissuhteet","Luottamus, rehellisyys, kuunteleminen ja rajojen kunnioittaminen ovat ihmissuhteiden eettisiä perusteita. Kunnioitus ei tarkoita, että kaikesta pitää olla samaa mieltä, vaan että toista kohdellaan ihmisarvoisesti.","### Suostumus ja rajat","Suostumus tarkoittaa vapaaehtoista ja ymmärrettyä suostumista. Painostus, uhkailu tai manipulointi eivät tee suostumuksesta aidosti vapaata. Omien rajojen tunnistaminen ja toisen rajojen kunnioittaminen ovat keskeisiä eettisiä taitoja.","### Kokeessa muista","Kun arvioit ihmissuhdetilannetta, kysy: toteutuvatko kunnioitus, luottamus, vapaaehtoisuus, turvallisuus ja tasavertaisuus?","### Hyvät ihmissuhteet","Terveessä ihmissuhteessa osapuolten rajoja kunnioitetaan. Luottamus syntyy vähitellen teoista, avoimuudesta ja siitä, että toinen voi sanoa ei ilman painostusta. Riidat eivät automaattisesti tarkoita huonoa suhdetta; tärkeää on se, miten ristiriitoja käsitellään. Kuunteleminen, anteeksipyyntö ja halu korjata omaa toimintaa ovat eettisesti merkittäviä.","### Suostumus ja rajat","Suostumus tarkoittaa vapaaehtoista ja selkeää suostumista. Toisen hiljaisuus, pelko tai painostaminen eivät ole sama asia kuin vapaa suostumus. Ihmissuhteiden etiikassa korostuvat yhdenvertaisuus, itsemääräämisoikeus ja toisen ihmisarvon kunnioittaminen. Näitä periaatteita voidaan soveltaa ystävyyteen, seurusteluun ja muihin läheisiin suhteisiin."],"ET 7":["### Elämän arvo ja ihmisarvo","Elämän ja kuoleman kysymyksissä voidaan pohtia, mitä tarkoittaa ihmiselämän arvo ja miten vaikeissa tilanteissa pitäisi toimia. Näihin kysymyksiin liittyy sekä yksilön oikeuksia että yhteiskunnan vastuuta.","### Abortti, saattohoito ja eutanasia","Aborttia koskevassa eettisessä keskustelussa voidaan tarkastella syntymättömän elämän moraalista asemaa, raskaana olevan henkilön itsemääräämisoikeutta ja erilaisia elämäntilanteita. Saattohoidossa keskeisiä ovat kärsimyksen lievittäminen ja ihmisarvo. Eutanasia tarkoittaa tarkoituksellista elämän päättämistä potilaan pyynnöstä tietyissä keskusteluissa määritellyissä tilanteissa, ja siihen liittyy erilaisia eettisiä kantoja.","### Kokeessa muista","Esitä vaikeissa bioeettisissä kysymyksissä useampi perusteltu näkökulma. Älä sekoita saattohoitoa ja eutanasiaa toisiinsa.","### Elämän arvo ja ihmisarvo","Elämän ja kuoleman kysymyksissä vastakkain voivat olla esimerkiksi elämän suojeleminen, itsemääräämisoikeus ja kärsimyksen vähentäminen. Eri maailmankatsomukset painottavat näitä periaatteita eri tavoin. Ihmisarvon ajatukseen kuuluu, että ihmisen arvo ei riipu hänen terveydestään, iästään tai toimintakyvystään.","### Vaikean kysymyksen rakenne","Kun kirjoitat vastauksen abortista, eutanasiaan, saattohoitoon tai muusta elämän loppuun liittyvästä aiheesta, määrittele ensin kysymys. Esittele vähintään kaksi perusteltua näkökulmaa, kerro niiden taustalla olevat arvot ja arvioi seurauksia. Lopuksi voit esittää oman kantasi, mutta perustele se. Tavoitteena ei ole löytää yhtä 'oikeaa mielipidettä', vaan osoittaa, että osaat ajatella eettisesti."],"ET 8":["### Hyvinvoinnin kokonaisuus","Terveys ei ole vain sairauden puuttumista. Hyvinvointiin liittyvät fyysinen, psyykkinen ja sosiaalinen ulottuvuus. Uni, lepo, turvallisuus, liikunta, ravinto ja ihmissuhteet voivat tukea hyvinvointia eri tavoin.","### Tutkimus ja terveystieto","Tieteellinen tutkimus perustuu menetelmiin, joilla väitteitä voidaan testata. Verkossa oleva terveystieto ei automaattisesti ole luotettavaa. On tärkeää arvioida lähde, kirjoittajan asiantuntemus ja se, perustuuko väite tutkimukseen.","### Urheilun etiikka","Reilu peli, turvallisuus, paineet ja suorituskykyyn vaikuttavat keinot ovat urheilun eettisiä kysymyksiä. Urheilijan hyvinvointi voi joutua ristiriitaan menestyspaineiden kanssa.","### Kokeessa muista","Hyvä vastaus yhdistää hyvinvoinnin eri ulottuvuudet ja käyttää konkreettista esimerkkiä. Muista myös, ettei hyvä elämä tarkoita jatkuvaa onnellisuutta.","### Hyvinvoinnin kokonaisuus","Hyvinvointi koostuu useista toisiinsa liittyvistä tekijöistä. Fyysinen terveys liittyy esimerkiksi uneen, ravintoon ja liikuntaan. Psyykkiseen hyvinvointiin kuuluvat tunteet, stressinhallinta ja turvallisuuden kokemus. Sosiaalinen hyvinvointi liittyy ihmissuhteisiin ja kokemukseen kuulumisesta yhteisöön. Yksi osa voi vaikuttaa muihin: esimerkiksi jatkuva unenpuute voi heikentää keskittymistä ja mielialaa.","### Urheilun etiikka","Urheilussa eettisiä kysymyksiä ovat esimerkiksi reilu peli, doping, kilpailupaineet, loukkaantumisriskit ja alaikäisten urheilijoiden kohtelu. Hyvä kilpailu perustuu sääntöjen noudattamiseen ja muiden kunnioittamiseen. Jos voiton tavoittelu johtaa terveyden vaarantamiseen tai epärehelliseen toimintaan, syntyy selkeä eettinen ongelma. Kontrollissa kannattaa erottaa toisistaan urheilijan henkilökohtainen vastuu ja valmentajien, seurojen sekä järjestöjen vastuu."]};function studyBlocks(sec,i,c,p){
  const key=c[0];
  const raw=c[2].split(/\n\s*\n/).filter(Boolean);
  const wordCount=c[2].trim().split(/\s+/).length;
  const add=CHAPTER_INFO[key]||[];
  const blocks=[];
  blocks.push(`<div class="study-length">📚 Kontrolliin valmistava teksti · ${wordCount}+ sanaa</div><h2 class="serif">📖 Perustiedot ja selitys</h2>`+raw.map(x=>`<p>${esc(x)}</p>`).join(''));
  for(let j=0;j<add.length;j+=2){
    if(add[j] && add[j+1]) blocks.push(`<h2>${esc(add[j].replace(/^###\s*/,''))}</h2><p>${esc(add[j+1])}</p>`);
  }
  blocks.push(`<h2>🔎 Keskeiset käsitteet tässä luvussa</h2><div class="concept-notes">${p.map(x=>`<div class="concept-note"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join('')}</div>`);
  blocks.push('<div class="study-summary"><h2>🧠 Kertaa ennen tehtäviä</h2><p>Varmista, että osaat selittää luvun pääajatuksen omin sanoin, määritellä tärkeimmät käsitteet ja antaa ainakin yhden oman esimerkin. Jos vertaat näkökulmia, kerro aina myös, miksi ne eroavat toisistaan.</p></div>');
  return blocks.join('');
}

 let c=DATA[sec][i],p=CONCEPTS[sec][i],s=c[2].split(/(?<=[.!?])\s+/).filter(Boolean),truth=s[0]||c[2],mix=[...p].sort(()=>Math.random()-.5);

 app.innerHTML=`<div class="reader"><button class="rail" onclick="home()">← TAKAISIN PÄÄVALIKKOON</button><div class="head"><div class="eyebrow">${esc(c[0])} • ${sec}</div><h1>${esc(c[1])}</h1><p class="chapter-lead">Opiskele tämä luku rauhassa. Teksti on kirjoitettu kokeeseen valmistautumista varten: ensin perusasiat, sitten tarkempi selitys ja lopuksi käsitteet, jotka kannattaa osata omin sanoin.</p><img class="illustration" src="${art(sec,i)}" alt="${esc(c[1])}"></div><nav class="toc"><button onclick="go('text')">📖 TEKSTI</button><button onclick="go('memory')">⭐ TÄRKEINTÄ</button><button onclick="go('tasks')">📝 TEHTÄVÄT</button></nav><article id="text" class="article study-article">${studyBlocks(sec,i,c,p)}</article><article id="memory" class="article memory"><h2 class="serif">⭐ TÄRKEINTÄ MUISTAA</h2><p class="memory-intro">Nämä ovat luvun ydinkohdat. Opettele ensin käsitteet ja niiden merkitys. Sen jälkeen harjoittele selittämään ne ilman kirjaa.</p><div class="memory-grid">${p.map(x=>`<div class="memory-item"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`).join('')}</div><div class="exam-box"><h3>🎓 Mitä osata kontrolliin?</h3><ul><li>Osaa määritellä luvun tärkeimmät käsitteet.</li><li>Osaa selittää asian omin sanoin ilman että kopioit oppikirjan lausetta.</li><li>Osaa antaa vähintään yhden konkreettisen esimerkin.</li><li>Osaa vertailla kahta näkökulmaa ja perustella oman vastauksesi.</li></ul></div></article><article id="tasks" class="article"><h2 class="serif">📝 MONIPUOLISET TEHTÄVÄT</h2>${tasks}</article></div>`;scrollTo(0,0)
}

function shuffleArr(a){return [...a].sort(()=>Math.random()-.5)}
function buildMiniQuestions(sec,from,to){
  const concepts=[];
  for(let i=from;i<=to;i++){
    const pairs=conceptPairs(sec,i);
    pairs.forEach(pair=>concepts.push({term:pair[0],def:pair[1],chapter:i+1,title:DATA[sec][i][1]}));
  }
  if(!concepts.length)return [];
  const qs=[];
  const pool=shuffleArr(concepts);
  const count=Math.min(10,pool.length*2);
  for(let n=0;n<count;n++){
    const x=pool[n%pool.length];
    if(n%2===0){
      let opts=shuffleArr([x.def,...shuffleArr(concepts.filter(y=>y.term!==x.term)).slice(0,3).map(y=>y.def)]);
      qs.push({type:'mc',chapter:x.chapter,title:x.title,question:`Mitä käsite ”${x.term}” tarkoittaa?`,options:opts,answer:opts.indexOf(x.def),explain:`${x.term} = ${x.def}`});
    }else{
      const makeTrue=Math.random()>.45;
      const other=shuffleArr(concepts.filter(y=>y.term!==x.term))[0]||x;
      const def=makeTrue?x.def:other.def;
      qs.push({type:'tf',chapter:x.chapter,title:x.title,question:`Onko seuraava väite oikein? ”${x.term} tarkoittaa ${def}.”`,answer:makeTrue,explain:makeTrue?`${x.term} tarkoittaa: ${x.def}`:`Oikea selitys: ${x.term} = ${x.def}`});
    }
  }
  return qs.slice(0,10);
}
function startMiniTest(){
  const sec=document.getElementById('testSubject').value;
  let from=Number(document.getElementById('testFrom').value), to=Number(document.getElementById('testTo').value);
  if(from>to){[from,to]=[to,from];document.getElementById('testFrom').value=from;document.getElementById('testTo').value=to;}
  const qs=buildMiniQuestions(sec,from,to);
  const area=document.getElementById('miniTestArea'); if(!area)return;
  if(!qs.length){area.innerHTML='<div class="article">Tälle alueelle ei löytynyt vielä tarpeeksi tehtäviä.</div>';return}
  area.innerHTML=`<div class="article mini-quiz"><div class="mini-quiz-head"><div><div class="eyebrow">${esc(sec==='US'?'USKONTO':'ETIIKAN PERUSTEET')}</div><h2 class="serif">Luvut ${from+1}–${to+1}</h2></div><span class="mini-count">${qs.length} tehtävää</span></div><p class="muted">Vastaa ensin ilman oppikirjaa. Jokaisesta oikeasta vastauksesta saat 1 pisteen.</p>

  }).join('')}</div><button class="btn" onclick="finishMiniTest()">TARKISTA KAIKKI VASTAUKSET</button><div id="miniResult" class="mini-result" hidden></div></div>`;
  area.scrollIntoView({behavior:'smooth',block:'start'});
}
function finishMiniTest(){
  const qs=[...document.querySelectorAll('.mini-question')]; let score=0,answered=0;
  qs.forEach(q=>{
    const chosen=q.querySelector('input:checked'); const expected=q.dataset.answer; const ok=chosen&&chosen.value===expected;
    q.classList.remove('mini-correct','mini-wrong');
    if(chosen)answered++;
    if(ok){score++;q.classList.add('mini-correct')}else q.classList.add('mini-wrong');
    const exp=q.querySelector('.mini-explain'); exp.hidden=false;
  });
  const result=document.getElementById('miniResult');

function updateGameChapters(){
 const sub=document.getElementById('gameSubject');if(!sub)return;const data=DATA[sub.value],f=document.getElementById('gameFrom'),t=document.getElementById('gameTo');
 const opts=data.map((c,i)=>`<option value="${i}">${esc(c[0])} — ${esc(c[1])}</option>`).join('');f.innerHTML=opts;t.innerHTML=opts;t.value=Math.min(2,data.length-1);if(!window._gameRangeInit){f.value=0;window._gameRangeInit=true}
}
function setGameRange(a,b){const f=document.getElementById('gameFrom'),t=document.getElementById('gameTo');if(!f||!t)return;const max=DATA[document.getElementById('gameSubject').value].length-1;f.value=Math.max(0,Math.min(a,max));t.value=Math.max(Number(f.value),Math.min(b,max))}
function gameScope(){let sec=document.getElementById('gameSubject').value,from=Number(document.getElementById('gameFrom').value),to=Number(document.getElementById('gameTo').value);if(from>to)[from,to]=[to,from];return {sec,from,to}}
function gamePairs(sec,from,to){let out=[];for(let i=from;i<=to;i++){const ps=CONCEPTS[sec]?.[i]||[];for(let j=0;j<ps.length;j+=2)if(ps[j]&&ps[j+1])out.push({term:ps[j],def:ps[j+1],chapter:i+1,chapterTitle:DATA[sec][i][1]})}return out}
function gameSentences(sec,from,to){let out=[];for(let i=from;i<=to;i++){const txt=DATA[sec][i][2]||'';txt.split(/(?<=[.!?])\s+/).filter(x=>x.length>45).slice(0,5).forEach(x=>out.push({text:x,chapter:i+1,title:DATA[sec][i][1]}))}return out}
function startGame(type){const {sec,from,to}=gameScope();const area=document.getElementById('gameArea');if(!area)return;if(type==='memory')return memoryGame(sec,from,to);if(type==='scramble')return scrambleGame(sec,from,to);if(type==='streak')return streakGame(sec,from,to);return quizGame(sec,from,to)}
function gameShell(title,sub,body){return `<div class="article game-board"><div class="game-head"><div><div class="eyebrow">PELIALUE</div><h2 class="serif">${title}</h2><p class="game-note">${sub}</p></div><button class="btn secondary" onclick="miniGames()">Vaihda peliä</button></div>${body}</div>`}
function quizGame(sec,from,to){
 const pairs=gamePairs(sec,from,to);if(!pairs.length){document.getElementById('gameArea').innerHTML=gameShell('Ei vielä tarpeeksi käsitteitä','Valitse suurempi lukualue.','<p>Valitsemallasi alueella ei ole tarpeeksi käsitepareja tähän peliin.</p>');return}
 const qs=shuffleArr(pairs).slice(0,10).map((p,i)=>{let wrong=shuffleArr(pairs.filter(x=>x.term!==p.term)).slice(0,3).map(x=>x.def);return {p,options:shuffleArr([p.def,...wrong])}});let n=0,score=0,locked=false;
 const render=()=>{if(n>=qs.length){const pct=Math.round(score/qs.length*100);document.getElementById('gameArea').innerHTML=gameShell('🏁 Peli valmis',`Alue: ${sec} ${from+1}–${to+1}`,`<div class="game-result"><div class="big">${score}/${qs.length}</div><p>${pct>=90?'Mahtavaa! Käsitteet ovat hyvin hallussa.':pct>=70?'Hyvä tulos! Kertaa vielä väärät käsitteet.':'Lue valittu alue uudelleen ja pelaa vielä kerran.'}</p><button class="btn" onclick="startGame('quiz')">Pelaa uudelleen</button></div>`);return}
 const q=qs[n];locked=false;document.getElementById('gameArea').innerHTML=gameShell('⚡ Pikavisa',`Kysymys ${n+1}/${qs.length} • Luku ${q.p.chapter}`,`<div class="game-stat"><span>⭐ Pisteet: ${score}</span><span>📚 ${esc(q.p.chapterTitle)}</span></div><div class="game-progress"><i style="width:${n/qs.length*100}%"></i></div><div class="game-question"><div class="eyebrow">Mikä selitys kuuluu käsitteeseen?</div><h2>${esc(q.p.term)}</h2><div class="game-options">${q.options.map((o,i)=>`<button class="game-option" onclick="answerQuiz(this,${i},'${encodeURIComponent(q.p.def)}',${q.options.indexOf(q.p.def)})">${esc(o)}</button>`).join('')}</div><div id="gameFeedback" class="game-feedback" hidden></div></div>`)};
 window.answerQuiz=(b,i,encoded,correct)=>{if(locked)return;locked=true;const ok=i===correct;b.classList.add(ok?'correct':'wrong');if(!ok)b.parentElement.querySelectorAll('.game-option')[correct].classList.add('correct');const f=document.getElementById('gameFeedback');f.hidden=false;f.innerHTML=ok?'✅ Oikein!':`❌ Oikea vastaus: <b>${decodeURIComponent(encoded)}</b>`;if(ok)score++;setTimeout(()=>{n++;render()},900)};render();
}
function memoryGame(sec,from,to){
 const pairs=shuffleArr(gamePairs(sec,from,to)).slice(0,8);const cards=shuffleArr(pairs.flatMap((p,i)=>[{id:i,type:'term',text:p.term},{id:i,type:'def',text:p.def}]));let open=[],matched=0,turns=0;
 document.getElementById('gameArea').innerHTML=gameShell('🧠 Muistipeli',`Yhdistä jokainen käsite oikeaan selitykseen. Käännöstä ei tarvita — tunnista merkitys.`,`<div class="game-stat"><span>Parit: ${pairs.length}</span><span id="memoryTurns">Siirrot: 0</span><span id="memoryMatched">Löydetty: 0</span></div><div class="memory-game-grid" id="memoryGrid">${cards.map((c,i)=>`<button class="memory-card" data-i="${i}" onclick="flipMemory(${i})">❓</button>`).join('')}</div><div id="memoryFeedback" class="game-feedback" hidden></div>`);
 window.flipMemory=(i)=>{const grid=document.getElementById('memoryGrid');const el=grid.children[i];if(el.classList.contains('matched')||open.some(x=>x.i===i)||open.length>=2)return;const c=cards[i];el.classList.add('revealed');el.innerHTML=`<b>${esc(c.text)}</b><small>${c.type==='term'?'KÄSITE':'SELITYS'}</small>`;open.push({i,c});if(open.length===2){turns++;document.getElementById('memoryTurns').textContent='Siirrot: '+turns;const [a,b]=open;if(a.c.id===b.c.id&&a.c.type!==b.c.type){ael=grid.children[a.i];bel=grid.children[b.i];ael.classList.add('matched');bel.classList.add('matched');matched++;document.getElementById('memoryMatched').textContent='Löydetty: '+matched;open=[];if(matched===pairs.length)document.getElementById('memoryFeedback').hidden=false;document.getElementById('memoryFeedback').textContent=matched===pairs.length?'🎉 Kaikki parit löytyivät! Käsitteet ovat nyt hyvin harjoiteltu.':''}else{setTimeout(()=>{[a.i,b.i].forEach(j=>{const x=grid.children[j];x.classList.remove('revealed');x.textContent='❓'});open=[]},750)}}};
}
function scrambleGame(sec,from,to){
 const words=shuffleArr(gamePairs(sec,from,to).map(x=>x.term).filter(x=>x.length>=4&&x.length<=22)).slice(0,8);if(!words.length){document.getElementById('gameArea').innerHTML=gameShell('🔤 Ei käsitteitä','Valitse toinen alue.','');return}let idx=0,typed='',score=0,letters=[];
 const render=()=>{if(idx>=words.length){document.getElementById('gameArea').innerHTML=gameShell('🏁 Käsite-sekoitus valmis','Harjoittelit käsitteiden kirjoitusasua.',`<div class="game-result"><div class="big">${score}/${words.length}</div><p>${score===words.length?'Täydellinen!':'Hyvä harjoitus — pelaa uudelleen ja yritä parantaa tulosta.'}</p><button class="btn" onclick="startGame('scramble')">Pelaa uudelleen</button></div>`);return}const word=words[idx],clean=word.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-zÅÄÖåäö]/g,'').toUpperCase();letters=shuffleArr(clean.split(''));typed='';document.getElementById('gameArea').innerHTML=gameShell('🔤 Käsite-sekoitus',`Kysymys ${idx+1}/${words.length} • Muista myös, mitä sana tarkoittaa.`,`<div class="scramble-word">${letters.join(' ')}</div><div class="typed-word" id="typedWord">_ _ _</div><div class="letter-buttons">${letters.map((l,i)=>`<button id="letter${i}" onclick="pickLetter(${i},'${encodeURIComponent(l)}')">${l}</button>`).join('')}</div><div class="game-actions"><button class="btn" onclick="checkScramble('${encodeURIComponent(clean)}')">Tarkista</button><button class="btn secondary" onclick="skipScramble()">Ohita</button></div><div id="scrambleFeedback" class="game-feedback" hidden></div>`)};
 window.pickLetter=(i,l)=>{const b=document.getElementById('letter'+i);if(b.disabled)return;b.disabled=true;typed+=decodeURIComponent(l);document.getElementById('typedWord').textContent=typed};window.checkScramble=(answer)=>{const f=document.getElementById('scrambleFeedback');f.hidden=false;if(typed===decodeURIComponent(answer)){score++;f.textContent='✅ Oikein!';}else f.innerHTML=`❌ Oikea järjestys: <b>${decodeURIComponent(answer)}</b>`;setTimeout(()=>{idx++;render()},800)};window.skipScramble=()=>{document.getElementById('scrambleFeedback').hidden=false;document.getElementById('scrambleFeedback').textContent='💡 Oikea vastaus: '+word;setTimeout(()=>{idx++;render()},1000)};render();
}
function streakGame(sec,from,to){
 const ss=gameSentences(sec,from,to);if(!ss.length){document.getElementById('gameArea').innerHTML=gameShell('🔥 Ei tarpeeksi väitteitä','Valitse suurempi alue.','');return}let questions=shuffleArr(ss).slice(0,12).map(x=>{const truth=Math.random()>.35;return {...x,truth,shown:truth?x.text:'Tämä väite ei liity tämän luvun aiheeseen.'}}),idx=0,streak=0,best=0;
 const render=()=>{if(idx>=questions.length){document.getElementById('gameArea').innerHTML=gameShell('🏁 Putki valmis',`Paras putki: ${best}`,`<div class="game-result"><div class="streak-fire">🔥 ${best}</div><p>${best>=8?'Erinomainen keskittyminen!':best>=5?'Hyvä putki!':'Harjoittele vielä ja yritä rikkoa ennätys.'}</p><button class="btn" onclick="startGame('streak')">Yritä uudelleen</button></div>`);return}const q=questions[idx];document.getElementById('gameArea').innerHTML=gameShell('🔥 Oikein vai väärin?',`Väite ${idx+1}/${questions.length} • Luku ${q.chapter}`,`<div class="streak-fire">${'🔥'.repeat(Math.min(streak+1,6))}</div><div class="game-stat"><span>Putki: ${streak}</span><span>Ennätys: ${best}</span></div><div class="game-question"><p>${esc(q.shown)}</p><div class="game-actions"><button class="btn" onclick="answerStreak(true)">Totta</button><button class="btn secondary" onclick="answerStreak(false)">Tarua</button></div><div id="streakFeedback" class="game-feedback" hidden></div></div>`)};
 window.answerStreak=(answer)=>{const q=questions[idx],ok=answer===q.truth,f=document.getElementById('streakFeedback');f.hidden=false;if(ok){streak++;best=Math.max(best,streak);f.textContent='✅ Oikein! Putki jatkuu.'}else{f.textContent='❌ Väärin. Lue luvun kohta uudelleen ja kokeile uudestaan.';streak=0}setTimeout(()=>{idx++;render()},750)};render();
}

(function(){
  const avatars = ["🌲","🦊","🦉","🐻","🐺","🦌","🐰","🐱","🦋","🌿"];
  window.forumAvatars = avatars;
  window.selectedForumAvatar = avatars[0];

  window.renderForumAvatarPicker = function(container){

    const avatars = window.forumAvatars || ["🌲","🦊","🦉","🐻","🐺","🦌","🐰","🐱","🦋","🌿"];
    container.innerHTML = '<div style="font-weight:800;margin-bottom:7px">Valitse avatar</div><div class="forum-avatar-picker">'+avatars.map((a,i)=>'<button type="button" class="forum-avatar-option '+((window.selectedForumAvatar||avatars[0])===a?'selected':'')+'" data-avatar="'+a+'">'+a+'</button>').join('')+'</div>';
    container.querySelectorAll("[data-avatar]").forEach(btn=>btn.addEventListener("click",()=>{
      window.selectedForumAvatar=btn.dataset.avatar;
      container.querySelectorAll(".forum-avatar-option").forEach(x=>x.classList.remove("selected"));
      btn.classList.add("selected");
    }));
  };

  // Patch forum post rendering if the site's forum uses localStorage.
  const oldSetItem = Storage.prototype.setItem;
  Storage.prototype.setItem = function(key,value){
    if(typeof key==="string" && /forum|post|message/i.test(key)){
      try{
        const data = JSON.parse(value);
        if(Array.isArray(data)){
          data.forEach(p=>{
            if(p && typeof p==="object" && !p.avatar) p.avatar = window.selectedForumAvatar || avatars[0];
          });
          value = JSON.stringify(data);
        }
      }catch(e){}
    }
    return oldSetItem.call(this,key,value);
  };
})();
</script>
